// glanceable progression cue vs last time (the note below carries the detail)
function progBadge(item){
  const iex=State.exercises.find(e=>e.id===item.exerciseId);
  if(item.kind==="weight" && isInverted(iex)) return el("span",{class:"progpill up"},"↓ less assist");
  if(item.kind==="deload" && isInverted(iex)) return el("span",{class:"progpill down"},"↑ more assist");
  if(item.kind==="weight") return el("span",{class:"progpill up"},"↑ heavier");
  if(item.kind==="rep")    return el("span",{class:"progpill up"},"↑ more reps");
  if(item.kind==="deload") return el("span",{class:"progpill down"},"↓ deload");
  if(item.kind==="hold")   return el("span",{class:"progpill hold"},"→ hold");
  if(item.kind==="mapped") return el("span",{class:"progpill hold"},"≈ from your other gym");
  return null;
}
// an exercise counts as done once it's minimized, or every set is checked off
const isItemDone = item => !!item.collapsed || (item.sets.length>0 && item.sets.every(s=>s.done));

// where a tapped "drop set" should land: right after the CURRENT ACTIVE set (first not-done),
// chained past any drops already on that set. Anchors on the set you're working now — not the last done.
function dropInsertIndex(sets){
  let ai=sets.findIndex(s=>!s.done);
  if(ai===-1) ai=sets.length-1;                            // all done → after the last set
  while(ai+1<sets.length && sets[ai+1].drop) ai++;         // keep chained drops together
  return ai+1;
}

/* set logger card for an item in the active session.
   isCurrent = the exercise you're working on now (first not-done one).
   Layout: a set TABLE (SET · LAST · KG · REPS · ✓) — last time's set sits on the same row as this
   time's, suggested targets render muted until you touch or tick them, and the rare actions live
   behind ⋯. "How did that feel?" only appears once every set is ticked, and answering it minimizes. */
const parseNum = v => { const n=parseFloat(String(v??"").replace(",",".")); return Number.isFinite(n)?n:0; };
const shortSet = (ex,w,r) => isBW(ex) ? ((+w>0)?`+${w}×${r}`:`${r}`) : isInverted(ex) ? `−${w}×${r}` : `${w}×${r}`;
const FEEL_LBL={easy:"Easy",solid:"Solid",grind:"Grind"};
function weightHead(ex){
  const u=(ex?.unit||"kg").toUpperCase();
  return isInverted(ex)?"ASSIST" : isBW(ex)?"+"+u : u==="LVL"?"LEVEL" : u;
}
// one editable number in the set table (weight or reps): − [value] + — type it, or step it
// (weight by the exercise's increment, reps by 1). opts: {disabled, onSave, plain}
function numCell(set, field, ex, opts={}){
  const touchedKey = field==="weight"?"wTouched":"rTouched";
  const onSave = opts.onSave || persistSession;
  const isTarget = !opts.plain && !set.done && !set[touchedKey];
  const label = field==="weight"?weightHead(ex).toLowerCase():"reps";
  const inp=el("input",{type:"text",class:"numcell"+(isTarget?" target":""),inputmode:field==="weight"?"decimal":"numeric",
    enterkeyhint:"next",autocomplete:"off","aria-label":label,value:String(set[field]??0)});
  const commit=v=>{ set[field]= field==="reps" ? Math.max(0,Math.round(v)) : Math.max(0,Math.round(v*100)/100);
    set[touchedKey]=true; inp.classList.remove("target"); onSave(); };
  inp.addEventListener("focus",()=>inp.select());
  inp.addEventListener("input",()=>commit(parseNum(inp.value)));
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault();
    const scope=inp.closest(".lcard,.sheet")||document;
    const cells=[...scope.querySelectorAll(".numcell:not(:disabled)")]; const nx=cells[cells.indexOf(inp)+1];
    if(nx) nx.focus(); else inp.blur(); } });
  const step = field==="weight" ? (+ex?.increment||2.5) : 1;
  const bump=d=>{ commit(parseNum(inp.value)+d*step); inp.value=String(set[field]); };
  const dec=el("button",{type:"button",class:"sbtn","aria-label":`Less ${label}`,onClick:()=>bump(-1)}, ic("minus",18));
  const inc=el("button",{type:"button",class:"sbtn","aria-label":`More ${label}`,onClick:()=>bump(1)}, ic("plus",18));
  if(opts.disabled){ inp.disabled=true; dec.disabled=inc.disabled=true; }
  return el("div",{class:"stepcell"}, dec, inp, inc);
}
// minimize an exercise and bring the next one into view
function advanceToCurrent(){
  requestAnimationFrame(()=>{ const c=document.querySelector(".lcard.current"); if(c) c.scrollIntoView({behavior:"smooth",block:"start"}); });
}
function loggerCard(item, isCurrent, ss){
  const ex = State.exercises.find(e=>e.id===item.exerciseId);
  const bw = isBW(ex);

  // ----- MINIMIZED (done) view: compact summary, tap to expand/edit -----
  if(item.collapsed){
    const logged=item.sets.filter(s=>s.done && s.reps>0);
    const summary=(logged.length? logged.map(s=>fmtSetShort(ex,s.weight,s.reps)).join(" · ") : "No sets logged")+(item.rpe?` · ${FEEL_LBL[item.rpe]}`:"");
    const expand=()=>{ item.collapsed=false; persistSession(); render(); };
    return el("div",{class:"card done",role:"button",tabindex:"0","aria-label":`${ex?.name||"Exercise"} — done. Tap to edit`,
        onClick:expand, onKeydown:e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();expand();}}},
      el("div",{class:"row",style:"gap:10px;align-items:center"},
        el("span",{class:"donecheck"}, ic("check",16)),
        el("div",{style:"min-width:0;flex:1"},
          el("div",{style:"font-weight:700"}, ex?.name||"Exercise"),
          el("div",{class:"small muted",style:"white-space:nowrap;overflow:hidden;text-overflow:ellipsis"}, summary)),
        el("span",{class:"small muted",style:"flex:none"},"Edit")));
  }

  // ----- UPCOMING (not current, not started, not in a superset): compact row, tap to expand -----
  const started = item.sets.some(s=>s.done);
  if(!isCurrent && !started && !ss && !item.peek){
    const open=()=>{ item.peek=true; render(); };
    const ub=progBadge(item);
    return el("div",{class:"card upcoming",role:"button",tabindex:"0","aria-label":`Expand ${ex?.name||"exercise"}`,
        onClick:open, onKeydown:e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open();}}},
      el("div",{class:"row between",style:"gap:10px;align-items:center"},
        el("div",{style:"min-width:0"},
          el("div",{class:"row",style:"gap:8px;align-items:center;flex-wrap:wrap"},
            el("div",{style:"font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"}, ex?.name||"Exercise"),
            ...(ub?[ub]:[])),
          el("div",{class:"small muted",style:"margin-top:2px"}, "Up next · "+fmtTargets(item, ex))),
        el("span",{class:"chev"},ic("chevron",18))));
  }

  // ----- EXPANDED view -----
  const pb = progBadge(item);
  const card=el("div",{class:"card lcard"+(isCurrent?" current":""),"data-exid":item.exerciseId});
  const thumb=el("div",{class:"exthumb",role:"button",tabindex:"0","aria-label":`View ${ex?.name||"exercise"} details`,
    onClick:()=>ex&&openExerciseProgress(ex.id), onKeydown:e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();ex&&openExerciseProgress(ex.id);}}}, ic("dumbbell",16));
  if(ex) exerciseImageId(ex).then(id=>{ if(id){ const im=document.createElement("img"); im.src=libImageUrl(id,0); im.loading="lazy"; im.alt=""; im.onerror=()=>im.remove(); thumb.append(im); } });
  card.append(el("div",{class:"lhead"},
    thumb,
    el("div",{style:"min-width:0;flex:1"},
      el("div",{class:"row",style:"gap:6px;align-items:center;flex-wrap:wrap"},
        ...(ss?[el("span",{class:"ssbadge"}, ss.letter+ss.n)]:[]),
        ...(isCurrent?[el("span",{class:"nowtag"},"NOW")]:[]),
        el("div",{class:"lname"},ex?.name||"Exercise"), ...(pb?[pb]:[]), ...(item.joint?[el("span",{class:"jointflag",title:"joint flagged"},ic("alert",13))]:[])),
      el("div",{class:"small muted"}, ex?`${ex.repMin}–${ex.repMax} reps · ${fmtRest(restOf(ex))} rest`:""),
      setupNoteLine(ex,{onSaved:render})),
    el("button",{class:"iconbtn","aria-label":`More options for ${ex?.name||"exercise"}`,onClick:()=>openItemMenu(item)}, ic("more",20))));
  if(item.note) card.append(el("div",{class:"suggestion"+(["deload","repeat"].includes(item.kind)?" warn":"")}, item.note));
  // what weight to log, for the ambiguous cases
  const logHint = ex && (isInverted(ex) ? "Log the assistance weight — less is harder, 0 = unassisted."
                  : ex.unit==="lvl" ? "Numbered stack — log the level you set (1, 2, 3…), not kg."
                  : ex.equipment==="dumbbell" ? `Log one dumbbell — e.g. 20 for a 20 ${ex.unit||"kg"} in each hand.`
                  : isPlate(ex) ? "Log just the plates you add — not the sled." : "");
  if(logHint) card.append(el("div",{class:"small muted loghint"}, ic("info",13), logHint));

  // ---- the set table ----
  const last=item.last&&item.last.sets&&item.last.sets.length ? item.last.sets : null;
  const wHead=weightHead(ex);
  if(last) card.append(el("div",{class:"lastline"}, el("span",{class:"lbl"},"Last time"),
    el("span",{}, last.map(s=>shortSet(ex,s.weight,s.reps)).join("  ·  "))));
  const table=el("div",{class:"settable"});
  table.append(el("div",{class:"sethead","aria-hidden":"true"},
    el("span",{},"Set"), el("span",{}, bw?"Reps":wHead), el("span",{}, bw?wHead:"Reps"), el("span",{})));
  let setNo=0;
  item.sets.forEach((set,si)=>{
    const drop=!!set.drop; if(!drop) setNo++;
    const n=setNo;                                       // captured per row (was a shared variable → every toast said the last set)
    const row=el("div",{class:"setrow"+(set.done?" locked":"")+(drop?" drop":"")});
    row.append(drop ? el("div",{class:"idx drop","aria-label":"drop set"},"↓") : el("div",{class:"idx"}, n));
    const wCell=numCell(set,"weight",ex,{disabled:set.done}), rCell=numCell(set,"reps",ex,{disabled:set.done});
    if(bw) row.append(rCell,wCell); else row.append(wCell,rCell);
    row.append(el("button",{class:"done"+(set.done?" on":""),"aria-label":set.done?`Undo set ${n}`:`Complete set ${n}`,"aria-pressed":set.done?"true":"false",onClick:async()=>{
      set.done=!set.done;
      if(set.done){
        const pr=await prCheck(ex,+set.weight,+set.reps);
        toast(pr || `${drop?"Drop set":"Set "+n}: ${fmtSetShort(ex,set.weight,set.reps)}`);
        maybeSeedCalib(ex, set);   // first set on an uncalibrated equivalent machine → one quick question
        const nxt=item.sets[si+1];   // bring the next un-logged set up to what you just did — but never
        if(nxt && !nxt.done && !nxt.drop && nxt.weight<=set.weight){        // clobber a value the user typed
          if(!nxt.wTouched) nxt.weight=set.weight;
          if(!nxt.rTouched) nxt.reps=set.reps;
        }
        // drops go straight into the next mini-set; the exercise's LAST set ends it — no pointless timer
        if(!drop){ if(item.sets.every(s2=>s2.done)) stopRest(); else startRest(restOf(ex), ex?.name); }
      } else stopRest();   // un-ticking cancels the rest you just started
      persistSession(); render();   // re-render so the row locks/unlocks
    }},ic("check",18)));
    table.append(row);
  });
  card.append(table);

  // add a set + live volume vs last time (the metric the progression targets).
  // On an assisted machine raw weight×reps counts the HELP — use effective load, or skip it.
  const foot=el("div",{class:"lfoot"});
  const lastSet=item.sets[item.sets.length-1];
  foot.append(el("div",{class:"row",style:"gap:4px"},
    el("button",{class:"linkbtn sm",onClick:()=>{
      item.sets.push({weight:lastSet?.weight||0,reps:lastSet?.reps||(ex?.repMin||8),done:false});
      persistSession(); render();
    }}, ic("plus",15), "Add set"),
    ...(item.sets.length>1 && !lastSet.done ? [el("button",{class:"linkbtn sm quiet",onClick:()=>{ item.sets.pop(); persistSession(); render(); }}, ic("minus",15), "Remove set")] : [])));
  const invVol = isInverted(ex);
  if(last && !(invVol && State.bodyweightKg==null)){
    const volOf = (w,r) => invVol ? (invEffectiveKg(ex,w)||0)*(+r||0) : bw ? (+r||0) : (+w||0)*(+r||0);
    const lastVol = last.reduce((t,s)=>t+volOf(s.weight,s.reps),0);
    const curVol = item.sets.reduce((t,s)=> t + (s.done?volOf(s.weight,s.reps):0), 0);
    const beat = curVol>0 && curVol>=lastVol, fmtV=v=>Math.round(v).toLocaleString();
    foot.append(el("div",{class:"volpill"+(beat?" beat":""),title:bw?"total reps vs last time":"weight × reps vs last time"},
      beat?ic("check",13):el("span"), `${bw?"Reps":"Volume"} ${fmtV(curVol)} / ${fmtV(lastVol)}${bw?"":" "+(ex?.unit||"kg")}`));
  }
  card.append(foot);

  // once every set is ticked: how did it feel? (tunes next time's target) — answering minimizes
  const allDone=item.sets.length>0 && item.sets.every(s=>s.done);
  if(allDone){
    const choose=level=>{
      item.rpe=level; item.sets.forEach(s=>{ if(s.done) s.rpe=level; });
      item.collapsed=true; delete item.peek; stopRest(); persistSession(); render(); advanceToCurrent();
    };
    const feel=el("div",{class:"feelbox"},
      el("div",{style:"font-weight:700"},"How did that feel?"),
      el("div",{class:"small muted",style:"margin:2px 0 8px"},"Sets next time's target — Easy pushes harder, Grind eases off."));
    const rpe=el("div",{class:"rpe"});
    ["easy","solid","grind"].forEach(level=>rpe.append(el("button",{class:item.rpe===level?"on":"","aria-pressed":item.rpe===level?"true":"false",onClick:()=>choose(level)}, FEEL_LBL[level])));
    feel.append(rpe, el("div",{class:"row between",style:"margin-top:6px"},
      el("button",{class:"jointtoggle"+(item.joint?" on":""),"aria-pressed":item.joint?"true":"false",onClick:()=>{item.joint=!item.joint;persistSession();render();}},
        ic("alert",14), item.joint?"Joint flagged — tap to clear":"Tweaked a joint?"),
      el("button",{class:"linkbtn sm",onClick:()=>{ item.collapsed=true; delete item.peek; persistSession(); render(); advanceToCurrent(); }}, item.rpe?"Minimize":"Skip")));
    card.append(feel);
  }
  return card;
}
// rare per-exercise actions, one tap away instead of six buttons on every card
/* ---------- notes ---------- */
// machine settings / setup note on an exercise ("Seat 4 · pad 3 · handle B") — one line, tap to edit.
// opts: {showAdd (offer "Add…" when empty), onSaved}
function setupNoteLine(ex, opts={}){
  if(!ex || (!ex.notes && !opts.showAdd)) return el("span",{style:"display:none"});
  const line=el("button",{type:"button",class:"setupline"+(ex.notes?"":" add"),"aria-label":ex.notes?`Setup note: ${ex.notes}. Tap to edit`:"Add a setup note",
    onClick:e=>{ e.stopPropagation(); editSetupNote(ex, ()=>{ line.replaceWith(setupNoteLine(ex, opts)); opts.onSaved&&opts.onSaved(); }); }},
    ic(ex.notes?"sliders":"plus",14), el("span",{}, ex.notes || "Add a setup note — seat, pad, grip…"));
  return line;
}
function editSetupNote(ex, onSaved){
  openSheet("Setup note",(body,close)=>{
    body.append(el("p",{class:"small muted",style:"margin:-6px 0 10px"},`For ${ex.name}: seat height, pad, pin, grip, bench angle — whatever you have to remember each time.`));
    const inp=el("input",{type:"text",value:ex.notes||"",placeholder:"e.g. Seat 4 · pad 3 · handle B",maxlength:"80","aria-label":"Setup note",enterkeyhint:"done"});
    const save=async()=>{ ex.notes=inp.value.trim()||null; if(!ex.notes) delete ex.notes;
      await DB.put("exercises",ex); State.exercises=await DB.all("exercises"); close(); onSaved&&onSaved(); };
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); save(); } });
    body.append(inp, el("button",{class:"btn",style:"margin-top:12px",onClick:save}, ic("check",16),"Save"));
    if(ex.notes) body.append(el("button",{class:"linkbtn center sm",onClick:()=>{ inp.value=""; save(); }},"Clear note"));
    setTimeout(()=>{ try{ inp.focus(); }catch(_){} },60);
  },{stacked:!!document.querySelector(".sheet-bg")});
}
// how a workout went — quick tags + one free line. Context for later ("why did bench dip? slept badly").
const SESSION_TAGS=["Felt strong","Slept badly","Low energy","Low on time","Busy gym","Injured","Sick"];
// tags that mark a ROUGH DAY: a shortfall on one doesn't lower your targets, count as a miss, or trip
// a plateau alert, and Insights compares those days with normal ones
const ROUGH_TAGS=new Set(["Slept badly","Low energy","Low on time","Busy gym","Injured","Sick"]);
const roughTags = se => ((se&&se.tags)||[]).filter(t=>ROUGH_TAGS.has(t));
const isRoughDay = se => roughTags(se).length>0;
const sessionNoteText = se => se ? [...(se.tags||[]), se.note].filter(Boolean).join(" · ") : "";
function sessionNoteEditor(se, onSave){   // onSave: custom persist (the workout in progress) — else writes the saved session
  const tags=new Set(se.tags||[]);
  const inp=el("input",{type:"text",value:se.note||"",placeholder:"Anything else? e.g. new shoes",maxlength:"120","aria-label":"Workout note",enterkeyhint:"done"});
  const save=async()=>{
    se.tags=[...tags]; se.note=inp.value.trim();
    if(onSave){ if(!se.tags.length) delete se.tags; if(!se.note) delete se.note; await onSave(); return; }
    const cur=(await DB.get("sessions",se.id))||se;
    if(se.tags.length) cur.tags=se.tags; else delete cur.tags;
    if(se.note) cur.note=se.note; else delete cur.note;
    await DB.put("sessions",cur);
  };
  const chips=el("div",{class:"filterchips wrapchips",style:"margin:0 0 8px"});
  SESSION_TAGS.forEach(t=>{ const b=el("button",{type:"button",class:"fchip"+(tags.has(t)?" on":""),"aria-pressed":tags.has(t)?"true":"false",onClick:()=>{
    if(tags.has(t)) tags.delete(t); else tags.add(t);
    b.classList.toggle("on",tags.has(t)); b.setAttribute("aria-pressed",tags.has(t)?"true":"false"); save(); }}, t); chips.append(b); });
  let tmr=null; inp.addEventListener("input",()=>{ clearTimeout(tmr); tmr=setTimeout(save,400); });
  inp.addEventListener("blur",()=>{ clearTimeout(tmr); save(); });
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); inp.blur(); } });
  return el("div",{class:"notebox"}, chips, inp);
}
// tag the workout while it's on — you usually know before the first set that you slept badly or
// are short on time. Saved with the workout; the finish screen shows them already picked.
function openWorkoutNoteSheet(){
  const s=State.activeSession; if(!s) return;
  openSheet("How's today going?",(body,close)=>{
    body.append(el("p",{class:"small muted",style:"margin:-6px 0 10px"},"Tag it now or at the end. A rough day that falls short won't count against your targets."),
      sessionNoteEditor(s, persistSession),
      el("button",{class:"btn",style:"margin-top:14px",onClick:close}, ic("check",16),"Done"));
  },{onClose:()=>render()});
}
function openItemMenu(item){
  const ex=State.exercises.find(e=>e.id===item.exerciseId);
  const items=State.activeSession.items, idx=items.indexOf(item);
  const grouped = item.ssGroup && ((items[idx-1]&&items[idx-1].ssGroup===item.ssGroup)||(items[idx+1]&&items[idx+1].ssGroup===item.ssGroup));
  openSheet(ex?.name||"Exercise",(body,close)=>{
    const act=(icon,label,fn,cls)=>el("button",{class:"menurow"+(cls?" "+cls:""),onClick:async()=>{ close(); await fn(); }}, ic(icon,18), el("span",{},label));
    const rows=[];
    if(ex) rows.push(act("info","Exercise details & history",()=>openExerciseProgress(ex.id)));
    if(ex) rows.push(act("sliders", ex.notes?"Edit setup note":"Add a setup note (seat, pad, grip…)",()=>editSetupNote(ex, render)));
    if(item.sets.some(s=>!s.done)) rows.push(act("check","Mark all sets done",()=>{ item.sets.forEach(s=>{ if((+s.reps)>0) s.done=true; }); stopRest(); persistSession(); render(); }));
    rows.push(act("arrowdown","Add a drop set",()=>{
      const di=dropInsertIndex(item.sets), base=item.sets[di-1];                        // after the current active set (+ any drops on it)
      item.sets.splice(di, 0, {weight:round((base?.weight||0)*0.8, ex?.increment||2.5), reps:base?.reps||(ex?.repMin||8), done:false, drop:true});
      persistSession(); render(); }));
    if(item.sets.length>1) rows.push(act("minus","Remove last set",()=>{ item.sets.pop(); persistSession(); render(); }));
    if(grouped) rows.push(act("x","Ungroup superset",()=>ungroupSS(item)));
    else if(idx<items.length-1) rows.push(act("link","Superset with the next exercise",()=>groupWithNext(item)));
    rows.push(act("alert", item.joint?"Clear the joint flag":"Flag a joint (tweaked something)",()=>{ item.joint=!item.joint; persistSession(); render(); }));
    rows.push(act("x","Remove from this workout",()=>removeItem(item),"danger"));
    body.append(...rows);
  });
}
async function removeItem(item){
  const ex=State.exercises.find(e=>e.id===item.exerciseId);
  const n=item.sets.filter(s=>s.done).length;
  if(n && !(await confirmSheet({title:`Remove ${ex?.name||"this exercise"}?`, message:`Its ${n} completed set${n===1?"":"s"} will be discarded.`, confirmLabel:"Remove", danger:true}))) return;
  const items=State.activeSession.items, at=items.indexOf(item);
  State.activeSession.items=items.filter(x=>x!==item); persistSession(); render();
  toast(`Removed ${ex?.name||"exercise"}`,{undo:async()=>{ State.activeSession.items.splice(Math.min(at,State.activeSession.items.length),0,item); await persistSession(); render(); }});
}
// "57.5kg × 12 · 11 · 11" — the targets a plan is asking for (or the rep range for a first time)
function fmtTargets(item, ex){
  const sets=item.sets.filter(s=>!s.drop); if(!ex||!sets.length) return "";
  const ws=sets.map(s=>+s.weight||0), reps=sets.map(s=>s.reps).join(" · ");
  if(item.kind==="new" || (!isBW(ex) && ws.every(w=>w===0) && !isPlate(ex))) return `${sets.length} sets · ${ex.repMin}–${ex.repMax} reps`;
  if(isBW(ex) && ws.every(w=>w===0)) return `${reps} reps`;
  if(ws.every(w=>w===ws[0])) return `${isBW(ex)?"+":isInverted(ex)?"−":""}${fmtW(ws[0],ex)} × ${reps}`;
  return sets.map(s=>shortSet(ex,s.weight,s.reps)).join(" · ");
}
function groupWithNext(item){
  const items=State.activeSession.items, i=items.indexOf(item), nxt=items[i+1]; if(!nxt) return;
  const gid=item.ssGroup||nxt.ssGroup||("ss-"+uid());
  item.ssGroup=gid; nxt.ssGroup=gid;
  persistSession(); render(); toast("Grouped as a superset");
}
function ungroupSS(item){
  const g=item.ssGroup; if(!g) return;
  State.activeSession.items.forEach(it=>{ if(it.ssGroup===g) delete it.ssGroup; });
  persistSession(); render(); toast("Superset ungrouped");
}

/* stepper input with +/- ; pass disabled=true to lock it (e.g. a completed set) */
function stepper(value, step, onChange, unit, disabled){
  const wrap=el("div",{class:"stepper"+(disabled?" locked":"")});
  const input=el("input",{type:"number",inputmode:"decimal","aria-label":unit,value:value??0,step});
  const dec=el("button",{"aria-label":`Decrease ${unit}`,onClick:()=>{input.value=Math.max(0,(+input.value||0)-step);onChange(+input.value);}},ic("minus",20));
  const inc=el("button",{"aria-label":`Increase ${unit}`,onClick:()=>{input.value=(+input.value||0)+step;onChange(+input.value);}},ic("plus",20));
  if(disabled){ input.disabled=true; input.readOnly=true; dec.disabled=true; inc.disabled=true; }
  input.addEventListener("change",()=>onChange(+input.value||0));
  input.addEventListener("focus",()=>input.select());
  wrap.append(dec,input,el("span",{class:"unit"},unit),inc);

}

// exercises queued from Insights ("Add to next workout") — pulled into the session being built
async function consumeQueuedExercises(){
  const q=await getMeta("queuedExercises"); if(!Array.isArray(q)||!q.length) return 0;
  const have=new Set(State.activeSession.items.map(i=>i.exerciseId));
  let n=0;
  for(const id of q){
    const ex=resolveExerciseAtGym(id); if(!ex||have.has(ex.id)) continue;
    await addToPlan(ex); have.add(ex.id); n++;
  }
  await setMeta("queuedExercises", []);
  if(n) toast(`Added ${n} you queued from Insights`);
  return n;
}

// commit the active session: save done sets, update per-exercise miss-streaks, close it out
async function commitSession(opts={}){
  const s=State.activeSession;
  // commit session + sets that are marked done. `order` runs across the WHOLE workout (not per
  // exercise) so the summary and history list exercises in the order you actually did them.
  let ord=0; const nowIso=new Date().toISOString();
  const done = s.items.flatMap(it=>it.sets.filter(x=>x.done&&x.reps>0).map(x=>({
    id:uid(),sessionId:s.id,exerciseId:it.exerciseId,weight:+x.weight,reps:+x.reps,
    rpe:x.rpe||it.rpe||null,joint:!!it.joint,order:ord++,createdAt:nowIso})));
  if(!done.length){
    if(!(await confirmSheet({title:"Nothing to save", message:"No sets are ticked as done. Discard this workout?", confirmLabel:"Discard workout", cancelLabel:"Keep logging", danger:true}))) return;
    State.activeSession=null; await setMeta("activeSession",null); render(); return;
  }
  // persist what was PRESCRIBED so Insights can score "did you hit your targets" later
  const targets={}; s.items.forEach(it=>{ if(it.targetVol!=null) targets[it.exerciseId]=it.targetVol; });
  const sessionRec={id:s.id,gymId:s.gymId,date:s.date,startedAt:s.startedAt,finishedAt:opts.stale?null:nowIso,
    ...(s.tags&&s.tags.length?{tags:s.tags}:{}), ...(s.note?{note:s.note}:{}),        // tagged mid-workout
    ...(Object.keys(targets).length?{targets}:{}),
    ...(s.planId?{planId:s.planId, planName:s.planName}:{})};
  await DB.put("sessions",sessionRec);
  if(s.planId) (State.planDays=State.planDays||[]).push({planId:s.planId, date:s.date});
  if(s.planId){ const plan=State.plans.find(p=>p.id===s.planId);   // plan usage: powers "done N days ago · M×"
    if(plan){ plan.lastUsedAt=s.date; plan.useCount=(plan.useCount||0)+1; await DB.put("plans",plan); } }
  for(const st of done) await DB.put("sets",st);
  // miss-aware progression: did the logged volume hit the prescribed target? track the streak per exercise
  for(const it of s.items){
    if(it.targetVol==null) continue;                                      // no volume target (manual / bodyweight) → skip
    const ex = State.exercises.find(e=>e.id===it.exerciseId); if(!ex) continue;
    const got = it.sets.filter(x=>x.done&&x.reps>0).reduce((t,x)=>t+((it.bwBase||0)+(+x.weight||0))*(+x.reps||0),0);   // same scale the target was solved on
    const met = got >= it.targetVol*0.98;                                 // within 2% counts as meeting it
    const rec = await getMeta(progKey(ex)) || {streak:0};
    await setMeta(progKey(ex), {streak: met?0:(rec.streak||0)+1, date:s.date});
  }
  // equivalent machines: refresh calibration ratios lazily; a mapped session's feel tunes them
  const eqIds=new Set(s.items.map(it=>State.exercises.find(e=>e.id===it.exerciseId)?.equivId).filter(Boolean));
  for(const eid of eqIds) await recomputeCalib(eid);
  for(const it of s.items){
    if(it.kind!=="mapped") continue;
    const ex=State.exercises.find(e=>e.id===it.exerciseId); if(!ex||!ex.equivId) continue;
    const rec=await getMeta("calib:"+ex.equivId); if(!rec || !(rec.ratio>0)) continue;
    const rpes=it.sets.filter(x=>x.done&&x.reps>0).map(x=>x.rpe||it.rpe).filter(Boolean);
    if(!rpes.length) continue;
    let f=1; if(rpes.includes("grind")) f=0.95; else if(rpes.every(r=>r==="easy")) f=1.05;
    if(f===1) continue;
    const isAnchor=linkedIds(ex.id).includes(rec.anchor);              // drift toward THIS machine's direction
    const drifted=rec.ratio*(isAnchor?1/f:f);
    const base=rec.fitted>0?rec.fitted:rec.ratio;
    rec.ratio=Math.max(base*0.85, Math.min(base*1.15, drifted));       // total drift capped at ±15% of the fit
    rec.updatedAt=new Date().toISOString();
    await putCalib(ex.equivId, rec);
  }
  _exStatus=null;   // training status changed
  State.activeSession=null; await setMeta("activeSession",null);
  const mins=sessionMins(sessionRec);
  gdriveAutoKick();
  setTab("history");
  openWorkoutComplete(sessionRec);   // the reward moment: PRs, vs last time, what's next — not an admin screen
}
// finished-workout summary: what went up, any records, and what next time asks for
async function openWorkoutComplete(se){
  const [sessions, allSets]=await Promise.all([DB.all("sessions"), DB.all("sets")]);
  const mine=allSets.filter(x=>x.sessionId===se.id && x.reps>0).sort((a,b)=>(a.order??0)-(b.order??0));
  const exIds=[...new Set(mine.map(x=>x.exerciseId))];
  const nth=sessions.filter(x=>x.date.slice(0,4)===se.date.slice(0,4) && (x.date+(x.startedAt||""))<=(se.date+(se.startedAt||""))).length;
  const mins=sessionMins(se);
  const sesById=Object.fromEntries(sessions.map(x=>[x.id,x]));
  const rows=[], prs=[];
  for(const exId of exIds){
    const ex=State.exercises.find(e=>e.id===exId); if(!ex) continue;
    const today=mine.filter(x=>x.exerciseId===exId);
    const ids=new Set(linkedIds(exId));
    const before=allSets.filter(x=>ids.has(x.exerciseId) && x.sessionId!==se.id && x.reps>0 && sesById[x.sessionId] &&
      (sesById[x.sessionId].date+(sesById[x.sessionId].startedAt||""))<(se.date+(se.startedAt||"")));
    const prev=await lastSetsFor(exId, se.id);
    const bw=isBW(ex), inv=isInverted(ex);
    const topW=a=>workLoad(ex, a.map(x=>+x.weight||0)), reps=a=>a.reduce((t,x)=>t+(+x.reps||0),0), vol=a=>a.reduce((t,x)=>t+(+x.weight||0)*(+x.reps||0),0);
    let delta=null, tone="hold";
    if(!prev || !before.length){ delta="first time"; }
    else {
      const p=prev.sets, tw=topW(today), pw=topW(p);
      if(!bw && (inv ? tw<pw : tw>pw)){ delta=inv?`▲ ${fmtW(pw-tw,ex)} less help`:`▲ +${fmtW(tw-pw,ex)} top set`; tone="up"; }
      else if(reps(today)>reps(p) && (bw || tw===pw)){ delta=`▲ +${reps(today)-reps(p)} rep${reps(today)-reps(p)===1?"":"s"}`; tone="up"; }
      else if(bw ? reps(today)===reps(p) : vol(today)>=vol(p)*0.98){ delta="= matched"; }
      else { delta="▼ below last time"; tone="down"; }
    }
    if(before.length){            // records vs everything BEFORE this workout
      const pr=computePRs(before, ex);
      if(bw){ const r=Math.max(...today.map(x=>+x.reps)); if(r>pr.maxReps) prs.push(`${ex.name} — most reps, ${r}`); }
      else if(!inv){
        const b1=Math.max(...today.map(x=>epley(+x.weight,+x.reps))), hw=Math.max(...today.map(x=>+x.weight));
        if(hw>pr.heaviest) prs.push(`${ex.name} — heaviest, ${fmtW(hw,ex)}`);
        else if(isAccessory(ex)){   // accessories: more reps at a weight than ever before (no fake 1RM)
          const t=topSet(today), was=Math.max(0,...before.filter(x=>(+x.weight||0)>=t.weight).map(x=>+x.reps||0));
          if(t.weight>0 && t.reps>was) prs.push(`${ex.name} — ${t.reps} reps at ${fmtW(t.weight,ex)}`);
        }
        else if(b1>pr.best1rm) prs.push(`${ex.name} — best est. 1RM, ${Math.round(b1)}${ex.unit||"kg"}`);
      }
    }
    const sug=await suggestNext(ex,{peek:true});
    rows.push({ex, today, delta, tone, key:isKeyLift(ex), next: sug && sug.plan ? fmtTargets({sets:sug.plan, kind:sug.kind}, ex) : "", nextKind:sug?.kind});
  }
  rows.sort((a,b)=>(b.key?1:0)-(a.key?1:0));   // key lifts lead the summary (stable: the rest keep workout order)
  openSheet("Workout done",(body,close)=>{
    body.append(el("div",{class:"done-hero"},
      el("span",{class:"done-badge"}, ic("check",28)),
      el("div",{}, el("div",{class:"done-title"},"Nice work."),
        el("div",{class:"small muted"}, [`Workout #${nth} this year`, mins?`${mins} min`:null, `${mine.length} sets`].filter(Boolean).join(" · ")))));
    if(prs.length){
      const card=el("div",{class:"card",style:"margin-top:12px"}, el("h2",{},`New record${prs.length>1?"s":""}`));
      prs.forEach(t=>card.append(el("div",{class:"row",style:"gap:8px;padding:6px 0;color:var(--accent-2);font-weight:600"}, ic("starfill",14), el("span",{style:"color:var(--text)"},t))));
      body.append(card);
    }
    body.append(el("div",{class:"sectionhead"},"Exercise by exercise"));
    rows.forEach(r=>body.append(el("button",{class:"donerow",onClick:()=>openExerciseProgress(r.ex.id)},
      el("div",{class:"row between",style:"gap:8px;align-items:flex-start"},
        el("div",{style:"min-width:0"},
          el("div",{style:"font-weight:700;display:flex;align-items:center;gap:6px"}, ...(r.key?[el("span",{style:"color:#F59E0B;display:inline-flex","aria-label":"key lift"},ic("starfill",13))]:[]), r.ex.name),
          el("div",{class:"small muted"}, r.today.map(x=>fmtSetShort(r.ex,x.weight,x.reps)).join(" · "))),
        el("span",{class:"progpill "+(r.tone==="up"?"up":r.tone==="down"?"down":"hold"),style:"flex:none"}, r.delta)),
      ...(r.next?[el("div",{class:"small",style:"margin-top:4px"}, el("span",{class:"muted"},"Next time: "), r.next, r.nextKind==="weight"?el("span",{style:"color:var(--accent-2);font-weight:700"}," ↑"):"")]:[]))));
    body.append(el("div",{class:"sectionhead"},"How did it go? (optional)"), sessionNoteEditor(se));
    body.append(el("button",{class:"btn",style:"margin-top:14px",onClick:close}, ic("check"), "Done"));
    if(!se.planId && exIds.length){
      const items=planItemsFromSets(mine);
      body.append(el("button",{class:"btn secondary",style:"margin-top:8px",onClick:()=>{ close(); saveSessionAsPlan(se, items); }}, ic("clipboard",16), "Save as a plan — repeat it in one tap"));
    }
    body.append(el("button",{class:"linkbtn center",onClick:()=>{ close(); openSessionDetail(se); }}, "View or edit in History"));
  },{onClose:()=>{ if(currentTab==="history") render(); }});   // the History row picks up the note
}

/* build an editable plan; suggestions are pre-filled but fully editable.
   setCount (optional) overrides how many sets to seed — used when loading a saved plan. */
async function addToPlan(ex, setCount){
  const sug=await suggestNext(ex);
  const base=sug.plan;
  const n=Math.max(1, setCount||base.length);
  State.activeSession.items.push({
    exerciseId:ex.id, kind:sug.kind, note:sug.note, joint:false, rpe:null, targetVol: sug.targetVol??null, bwBase: sug.bwBase??null,
    last: sug.prev ? {date:sug.prev.session.date, sets:sug.prev.sets.map(s=>({weight:s.weight,reps:s.reps}))} : null,
    sets:Array.from({length:n},(_,i)=>{const p=base[Math.min(i,base.length-1)]||{weight:0,reps:ex.repMin||8};return {weight:p.weight,reps:p.reps,done:false};})
  });
  await persistSession();
}
/* ---------- plans / routines: save a workout once, repeat it in one tap ---------- */
// a plan stores the MOVEMENTS (exerciseId + set count), not frozen weights — so repeating it
// re-suggests progressed targets from your latest history.
async function savePlan(name){
  return savePlanFromItems(name, State.currentGymId, State.activeSession.items.map(it=>({exerciseId:it.exerciseId, sets:it.sets.length})));
}
async function savePlanFromItems(name, gymId, items){
  const plan={ id:uid(), gymId: gymId||State.currentGymId, name:(name||"").trim()||suggestPlanName(items),
    items, createdAt:new Date().toISOString() };
  await DB.put("plans",plan); State.plans.push(plan); return plan;
}
// turn a past session's logged sets into plan items, preserving exercise order, dropping deleted exercises
function planItemsFromSets(sets){
  const seen=new Set(), counts={}, items=[];
  sets.forEach(x=>{ counts[x.exerciseId]=(counts[x.exerciseId]||0)+1; });
  sets.slice().sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||"")||(a.order-b.order)).forEach(x=>{
    if(!seen.has(x.exerciseId)){ seen.add(x.exerciseId); if(State.exercises.find(e=>e.id===x.exerciseId)) items.push({exerciseId:x.exerciseId, sets:counts[x.exerciseId]}); }
  });
  return items;
}
async function deletePlan(id){ await DB.del("plans",id); State.plans=State.plans.filter(p=>p.id!==id); }
// add a plan's exercises to the current session, resolving each to this gym's equivalent.
// `unresolved` = machines that exist (at another gym) but aren't set up here yet — offer to add them.
async function applyPlanToSession(plan){
  const have=new Set(State.activeSession.items.map(i=>i.exerciseId));
  let added=0, heavier=0; const unresolved=[];
  for(const it of plan.items){
    const orig=State.exercises.find(e=>e.id===it.exerciseId);
    const ex=resolveExerciseAtGym(it.exerciseId, State.currentGymId);
    if(!ex){ if(orig) unresolved.push({ex:orig, sets:it.sets}); continue; }  // deleted → silently skip
    if(have.has(ex.id)) continue;
    await addToPlan(ex, it.sets); have.add(ex.id); added++;
    if(State.activeSession.items[State.activeSession.items.length-1]?.kind==="weight") heavier++;
  }
  return {added, heavier, unresolved};
}
async function startSessionFromPlan(plan){
  if(!curGym()){ openGymSheet(); return; }
  State.activeSession={ id:uid(), gymId:State.currentGymId, date:todayISO(), started:false, startedAt:null, items:[],
    planId:plan.id||null, planName:plan.name||null };   // carried onto the session record at finish (null = "repeat last workout")
  const {heavier,unresolved}=await applyPlanToSession(plan);
  await consumeQueuedExercises();
  await persistSession(); window.scrollTo(0,0); render();
  let msg=plan.name?`Loaded "${plan.name}"`:"Loaded your last workout";
  if(heavier) msg+=` · ${heavier} lift${heavier>1?"s":""} going heavier`;
  toast(msg);
  if(unresolved.length) promptAddMissing(unresolved);
}
// machines in the plan that aren't set up at the current gym — add them here (linked, so progress pools) or skip

async function addMissingToGym(list){
  let n=0;
  for(const {ex,sets} of list){
    let lid=ex.linkId;                                   // link the new copy to the original so progress pools
    if(!lid){ lid=uid(); ex.linkId=lid; await DB.put("exercises",ex); }
    const copy={...ex, id:uid(), gymId:State.currentGymId, linkId:lid}; delete copy.createdAt;
    await DB.put("exercises",copy); State.exercises.push(copy);
    await addToPlan(copy, sets); n++;
  }
  await persistSession();
  return n;
}

   SHEETS (modals)

let _sheetSeq=0;
function openSheet(title, buildBody, opts={}){
  const stacked=!!opts.stacked;                 // stacked: layer over the current sheet instead of replacing it
  const full=!!opts.full;                       // full: a full-screen page with a Back button (exercise detail)
  const host=$("#sheetHost");
  const returnFocus=document.activeElement;     // focus goes back here on close
  const bg=el("div",{class:"sheet-bg"+(full?" full":"")}); if(stacked) bg.style.zIndex=String(55+(++_sheetSeq%20));
  let onKey, closed=false;
  const close=()=>{ if(closed) return; closed=true;
    document.removeEventListener("keydown",onKey);
    if(stacked){ bg.remove(); } else { host.innerHTML=""; }
    if(!document.querySelector(".sheet-bg")) document.body.classList.remove("modal-open");
    if(opts.onClose) opts.onClose();                       // onClose runs on EVERY close path (✕, backdrop, Esc, programmatic)
    try{ if(returnFocus && returnFocus.isConnected && returnFocus.focus) returnFocus.focus({preventScroll:true}); }catch(e){}
  };
  const isTop=()=>{ const bgs=document.querySelectorAll(".sheet-bg"); return bgs.length && bgs[bgs.length-1]===bg; };
  onKey=e=>{
    if(!isTop()) return;
    if(e.key==="Escape"){ e.preventDefault(); close(); return; }   // Esc closes the topmost sheet
    if(e.key==="Tab"){                                            // keep keyboard focus inside the open dialog
      const f=[...sheet.querySelectorAll('button,[href],input,select,textarea,summary,[tabindex]:not([tabindex="-1"])')].filter(n=>!n.disabled && n.offsetParent!==null);
      if(!f.length) return;
      const first=f[0], last=f[f.length-1];
      if(e.shiftKey && (document.activeElement===first || document.activeElement===sheet)){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    }
  };
  document.addEventListener("keydown",onKey);
  bg.addEventListener("click",e=>{ if(e.target===bg) close(); });
  const hid="sh"+(++_sheetSeq);
  const sheet=el("div",{class:"sheet"+(full?" full":""),role:"dialog","aria-modal":"true","aria-labelledby":hid,tabindex:"-1"});
  if(!full) sheet.append(el("div",{class:"grabber"}));
  sheet.append(full
    ? el("div",{class:"sheethead fullhead"},
        el("button",{class:"backbtn","aria-label":"Back",onClick:close}, el("span",{class:"ic back"},ic("chevron",20)), "Back"),
        el("h2",{id:hid},title))
    : el("div",{class:"sheethead"},
        el("h2",{id:hid},title),
        el("button",{class:"sheetclose","aria-label":"Close",onClick:close}, ic("x",20))));
  buildBody(sheet, close);

// in-app replacement for window.confirm(): themed, never shows the site's domain, doesn't block the page
function confirmSheet({title, message, confirmLabel="Confirm", cancelLabel="Cancel", danger=false}){
  return new Promise(res=>{
    let answered=false;
    openSheet(title,(body,close)=>{
      if(message) body.append(el("p",{class:"small muted",style:"margin:-6px 0 14px"}, message));
      body.append(

    },{stacked:!!document.querySelector(".sheet-bg"), onClose:()=>{ if(!answered) res(false); }});

// Keep an open bottom sheet above the iOS software keyboard. Focusing an input shrinks the
// visual viewport; a position:fixed sheet can't be scrolled by iOS to clear the keyboard, so
// without this the keyboard (and its ^ v Done bar) covers the field and the layout looks broken.
function adjustOpenSheets(){
  const vv=(typeof window!=="undefined") && window.visualViewport; if(!vv) return;
  const overlap=Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)); // keyboard height (0 when hidden)
  document.querySelectorAll(".sheet-bg .sheet").forEach(sheet=>{
    sheet.style.marginBottom = overlap>0 ? overlap+"px" : "";          // float above the keyboard
    sheet.style.maxHeight    = overlap>0 ? (Math.round(vv.height)-8)+"px" : ""; // shrink to fit; else CSS 88vh
  });
}
if(typeof window!=="undefined" && window.visualViewport){
  visualViewport.addEventListener("resize", adjustOpenSheets);
  visualViewport.addEventListener("scroll", adjustOpenSheets);
}

function muscleSelect(value, includeNone){
  const sel=document.createElement("select");
  if(includeNone){ const o=document.createElement("option"); o.value=""; o.textContent="None"; sel.append(o); }
  REGION_ORDER.forEach(region=>{
    const keys=Object.keys(MUSCLES).filter(k=>MUSCLES[k].region===region);
    if(!keys.length)return;
    const og=document.createElement("optgroup"); og.label=region;
    keys.forEach(k=>{ const o=document.createElement("option"); o.value=k; o.textContent=MUSCLES[k].label; og.append(o); });
    sel.append(og);
  });
  sel.value=value||"";
  return sel;
}
function equipSelect(value){
  const sel=document.createElement("select");
  EQUIP_ORDER.forEach(k=>{ const o=document.createElement("option"); o.value=k; o.textContent=EQUIP[k].label; sel.append(o); });
  sel.value=value||"machine";
  return sel;
}
const REST_OPTS=[30,45,60,75,90,120,150,180,240,300];
function restSelect(value){
  const sel=document.createElement("select");
  REST_OPTS.forEach(s=>{ const o=document.createElement("option"); o.value=s; o.textContent=fmtRest(s); sel.append(o); });
  // snap to the nearest preset if the value isn't already one
  const snapped=REST_OPTS.includes(+value)?+value:REST_OPTS.reduce((a,b)=>Math.abs(b-value)<Math.abs(a-value)?b:a,REST_OPTS[0]);
  sel.value=String(snapped);
  return sel;
}
// togglable gym chips for a machine's "available at"; lockedSet = gyms already in the group (can't remove here)
function gymMultiSelect(preChecked, lockedSet, onChange){
  const checked=new Set(preChecked);
  const wrap=el("div",{class:"filterchips",style:"flex-wrap:wrap"});
  State.gyms.forEach(g=>{
    const locked=lockedSet&&lockedSet.has(g.id);
    const chip=el("button",{type:"button",class:"fchip"+(checked.has(g.id)?" on":"")}, g.name);
    if(locked){ chip.disabled=true; chip.style.opacity="0.8"; }
    else chip.addEventListener("click",()=>{ checked.has(g.id)?checked.delete(g.id):checked.add(g.id); chip.classList.toggle("on"); onChange&&onChange(); });
    wrap.append(chip);

}

/* ---------- merge exercises ----------
   Duplicates ("Incline Db Press" next to "Incline Bench Press (Dumbbell)") split one lift's history
   and every chart built on it. Merging moves the sets (and plan slots, saved targets, queue) into the
   keeper and removes the duplicate. Undo-able for a few seconds. */
function mergeBlocker(src, tgt){
  if((src.unit||"kg")!==(tgt.unit||"kg")) return `${src.name} logs in ${src.unit||"kg"} and ${tgt.name} in ${tgt.unit||"kg"} — merging would mix the numbers. Change one exercise's unit first.`;
  if(isInverted(src)!==isInverted(tgt)) return "One of these is an assisted machine (less weight = harder) and the other isn't, so their numbers mean opposite things.";
  if(isBW(src)!==isBW(tgt)) return "One of these is a bodyweight exercise (the weight is added load) and the other isn't, so their numbers don't line up.";
  if(State.activeSession && State.activeSession.items.some(i=>i.exerciseId===src.id)) return `${src.name} is in your current workout. Finish the workout (or remove it from it) first.`;
  return null;
}
function openMergeSheet(src, closeEditor){
  openSheet("Merge into…",(body,close)=>{
    body.append(el("p",{class:"small muted",style:"margin:-6px 0 10px"},
      "Pick the exercise to keep. ", el("b",{},src.name), "’s logged sets move into it — one history, one chart — and ", el("b",{},src.name), " is removed."));
    const search=el("input",{type:"text",placeholder:"Search your exercises…","aria-label":"Search your exercises",autocomplete:"off"});
    const list=el("div",{style:"margin-top:8px"});
    body.append(search, list);
    const group=new Set(linkedIds(src.id));
    const pool=State.exercises.filter(e=>!group.has(e.id));
    const row=e=>el("button",{class:"pickrow",style:"width:100%;text-align:left;color:inherit",onClick:()=>confirmMerge(src,e,()=>{ close(); closeEditor&&closeEditor(); })},
      el("div",{class:"grow"}, el("div",{class:"pk-name"},e.name),
        el("div",{class:"pk-meta"},[equipLabel(e.equipment), (e.unit||"kg"), e.gymId&&State.gyms.length>1?gymNameOf(e.gymId):null].filter(Boolean).join(" · "))),
      el("span",{class:"chev"},ic("chevron",16)));
    const paint=()=>{ const q=normName(search.value); list.replaceChildren();
      if(q){ const r=rankByMatch(q,pool,e=>e.name); r.slice(0,40).forEach(e=>list.append(row(e)));
        if(!r.length) list.append(el("p",{class:"small muted"},"No exercise matches.")); return; }
      const likely=rankByMatch(normName(src.name), pool, e=>e.name).slice(0,5);
      if(likely.length){ list.append(el("div",{class:"regionhead"},"Likely the same")); likely.forEach(e=>list.append(row(e))); }
      list.append(el("div",{class:"regionhead"},"All your exercises"));
      pool.filter(e=>!likely.includes(e)).sort((a,b)=>a.name.localeCompare(b.name)).forEach(e=>list.append(row(e)));
    };
    search.addEventListener("input",paint); paint();
  },{stacked:true});
}
async function confirmMerge(src, tgt, done){
  const why=mergeBlocker(src,tgt); if(why){ noticeSheet("Can't merge these", why); return; }
  const sets=await DB.byIndex("sets","exerciseId",src.id);
  const nSes=new Set(sets.map(x=>x.sessionId)).size;
  if(!(await confirmSheet({title:`Merge into ${tgt.name}?`,
    message:`${sets.length} set${sets.length===1?"":"s"} from ${nSes} workout${nSes===1?"":"s"} move from ${src.name} into ${tgt.name}, and ${src.name} is removed. ${tgt.name} keeps its own settings (rep range, rest, increment).`,
    confirmLabel:"Merge"}))) return;
  const undo=await mergeExercises(src, tgt, sets);
  done&&done(); render();
  toast(`Merged into ${tgt.name}`,{undo});
}
async function mergeExercises(src, tgt, sets){
  const snap={src:JSON.parse(JSON.stringify(src)), tgt:JSON.parse(JSON.stringify(tgt)), sets:sets.map(x=>x.id), sessions:[], plans:[], queued:null};
  for(const x of sets){ x.exerciseId=tgt.id; await DB.put("sets",x); }
  for(const se of await DB.all("sessions")){                 // saved prescriptions (target hit-rate) move with the sets
    if(!se.targets || se.targets[src.id]==null) continue;
    snap.sessions.push(JSON.parse(JSON.stringify(se)));
    if(se.targets[tgt.id]==null) se.targets[tgt.id]=se.targets[src.id];
    delete se.targets[src.id]; await DB.put("sessions",se); }
  for(const p of State.plans){
    if(!p.items.some(it=>it.exerciseId===src.id)) continue;
    snap.plans.push(JSON.parse(JSON.stringify(p)));
    p.items = p.items.some(it=>it.exerciseId===tgt.id) ? p.items.filter(it=>it.exerciseId!==src.id)
      : p.items.map(it=>it.exerciseId===src.id?{...it,exerciseId:tgt.id}:it);
    await DB.put("plans",p); }
  const q=await getMeta("queuedExercises");
  if(Array.isArray(q) && q.includes(src.id)){ snap.queued=q.slice(); await setMeta("queuedExercises",[...new Set(q.map(id=>id===src.id?tgt.id:id))]); }
  // the keeper inherits what it doesn't have yet
  if(src.fav && !isKeyLift(tgt)) tgt.fav=true;
  if(src.notes && !tgt.notes) tgt.notes=src.notes;
  if(src.libId && !tgt.libId) tgt.libId=src.libId;
  await DB.put("exercises",tgt);
  await DB.del("exercises",src.id);
  State.exercises=await DB.all("exercises"); State.plans=await DB.all("plans"); _exStatus=null;
  return async()=>{
    await DB.put("exercises",snap.src); await DB.put("exercises",snap.tgt);
    const ids=new Set(snap.sets);
    for(const x of await DB.byIndex("sets","exerciseId",tgt.id)) if(ids.has(x.id)){ x.exerciseId=src.id; await DB.put("sets",x); }
    for(const se of snap.sessions) await DB.put("sessions",se);
    for(const p of snap.plans) await DB.put("plans",p);
    if(snap.queued) await setMeta("queuedExercises",snap.queued);
    State.exercises=await DB.all("exercises"); State.plans=await DB.all("plans"); _exStatus=null; render();
  };
}

// touch/mouse drag-to-reorder: rows are direct children of `container`, each with a [data-grip] handle.
// The dragged row follows the finger; the others slide to make room; onReorder(from,to) commits on drop.
function makeSortable(container, onReorder){
  container.querySelectorAll("[data-grip]").forEach(handle=>{
    handle.style.touchAction="none";
    let drag=null;
    handle.addEventListener("pointerdown", e=>{
      e.preventDefault();
      const row=handle.closest("[data-sort]"); if(!row) return;
      const rows=[...container.children], rects=rows.map(r=>r.getBoundingClientRect());
      const from=rows.indexOf(row), step=rows.length>1?(rects[1].top-rects[0].top):rects[0].height;
      drag={rows,rects,from,to:from,step,startY:e.clientY,pid:e.pointerId,row};
      try{ handle.setPointerCapture(e.pointerId); }catch(_){}
      row.style.transition="none"; row.style.position="relative"; row.style.zIndex="5";
      row.style.boxShadow="0 12px 26px -10px rgba(0,0,0,.55)"; row.style.opacity=".97";
    });
    handle.addEventListener("pointermove", e=>{
      if(!drag||drag.pid!==e.pointerId) return;
      const dy=e.clientY-drag.startY;
      drag.row.style.transform=`translateY(${dy}px)`;
      const center=drag.rects[drag.from].top+drag.rects[drag.from].height/2+dy;
      let to=drag.from;
      while(to<drag.rows.length-1 && center>drag.rects[to+1].top+drag.rects[to+1].height/2) to++;
      while(to>0 && center<drag.rects[to-1].top+drag.rects[to-1].height/2) to--;
      if(to!==drag.to){ drag.to=to;
        drag.rows.forEach((r,j)=>{ if(r===drag.row) return;
          let shift=0;
          if(to>drag.from && j>drag.from && j<=to) shift=-drag.step;
          else if(to<drag.from && j<drag.from && j>=to) shift=drag.step;
          r.style.transition="transform .15s ease"; r.style.transform=shift?`translateY(${shift}px)`:"";
        });
      }
    });
    const end=e=>{ if(!drag||drag.pid!==e.pointerId) return;
      const {rows,from,to}=drag; drag=null;
      try{ handle.releasePointerCapture(e.pointerId); }catch(_){}
      rows.forEach(r=>{ r.style.transition=""; r.style.transform=""; r.style.position=""; r.style.zIndex=""; r.style.boxShadow=""; r.style.opacity=""; });
      if(to!==from) onReorder(from,to);
    };
    handle.addEventListener("pointerup", end);
    handle.addEventListener("pointercancel", end);
  });
}

// ONE exercise picker for every "choose an exercise" flow (today's workout, plan editor, a past

// chips narrow it; a sticky "N added · Done" shows what you've picked.
//   opts: {title, gymId, isAdded(exId), onAdd(ex), onRemove(ex,{created}), exclude:Set, single, actLabel, intro, afterClose}
const PICK_EQUIP=[["all","All"],["barbell","Barbell"],["dumbbell","Dumbbell"],["machine","Machine"],["cable","Cable"],["bodyweight","Bodyweight"],["other","Other"]];
const pickEquipOf = e => e==="plate"?"machine" : (e==="kettlebell"||e==="freeplate"||!e)?"other" : e;
function openExercisePicker(opts={}){
  const gid=opts.gymId||State.currentGymId;
  let added=0, eqF="all", closeFn=null;
  const created=new Set();                       // library entries this picker turned into exercises
  openSheet(opts.title||"Add exercise",(body,close)=>{
    closeFn=close;
    if(opts.intro) body.append(el("p",{class:"small muted",style:"margin:-6px 0 8px"}, opts.intro));
    if(State.gyms.length>1 && !opts.single) body.append(el("p",{class:"small muted",style:"margin:-6px 0 8px"},
      "Machines & cables save to ", el("b",{}, gymNameOf(gid)||"this gym"), "; free weights are shared across your gyms."));
    const search=el("input",{type:"text",placeholder:"Search exercises…","aria-label":"Search exercises",autocomplete:"off"});
    const chips=el("div",{class:"filterchips",style:"margin:8px 0 2px"});
    const paintChips=()=>{ chips.replaceChildren(...PICK_EQUIP.map(([k,l])=>el("button",{class:"fchip"+(eqF===k?" on":""),"aria-pressed":eqF===k?"true":"false",onClick:()=>{ eqF=k; paintChips(); rerender(); }},l))); };
    paintChips();
    const results=el("div",{}), foot=el("div",{});
    const footer=el("div",{class:"pickfoot",style:"display:none"});
    body.append(el("div",{class:"pickhead"}, search, chips), results, foot, footer);
    const own=()=>State.exercises.filter(e=>(e.gymId===gid||e.gymId==null) && !(opts.exclude&&opts.exclude.has(e.id)));
    const eqOK=e=>eqF==="all" || pickEquipOf(e.equipment)===eqF;
    const libVisible=le=>{ const o=libOwnedExercise(le.raw); return !o; };
    const paintFooter=()=>{ footer.style.display=(added>0&&!opts.single)?"":"none";
      footer.replaceChildren(el("button",{class:"btn",onClick:close}, ic("check",16), `${added} added · Done`)); };
    function row({name, meta, imgId, imgPromise, ex, le}){
      const thumb=el("button",{class:"exthumb","aria-label":`${name} details`,onClick:e=>{ e.stopPropagation(); if(ex) openExerciseProgress(ex.id); else if(le) openLibraryDetail(le); }}, ic("dumbbell",16));
      const setImg=id=>{ if(!id)return; const im=document.createElement("img"); im.src=libImageUrl(id,0); im.loading="lazy"; im.alt=""; im.onerror=()=>im.remove(); thumb.append(im); };
      if(imgId) setImg(imgId); else if(imgPromise) imgPromise.then(setImg);
      const state=el("span",{class:"pickstate"});
      const r=el("div",{class:"pickrow",role:"button",tabindex:"0"}, thumb,
        el("div",{class:"grow"}, el("div",{class:"pk-name"},name), el("div",{class:"pk-meta"},meta)), state);
      let curEx=ex||null, on=!!(ex && opts.isAdded && opts.isAdded(ex.id));
      const paint=()=>{ r.classList.toggle("on",on); r.setAttribute("aria-pressed",on?"true":"false");
        r.setAttribute("aria-label",`${on?"Remove":opts.actLabel||"Add"} ${name}`);
        state.replaceChildren(on?ic("check",18):ic("plus",18)); };
      paint();
      const act=async()=>{
        if(on){ if(!opts.onRemove) return; on=false; paint(); added=Math.max(0,added-1); paintFooter();
          await opts.onRemove(curEx,{created:created.has(curEx.id)}); return; }
        on=true; paint();
        if(!curEx && le){ curEx=libOwnedExercise(le.raw); if(!curEx){ curEx=await addLibraryExercise(le.raw); created.add(curEx.id); } }
        await opts.onAdd(curEx);
        if(opts.single){ close(); return; }
        added++; paintFooter();
      };
      r.addEventListener("click",act);
      r.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); act(); } });
      return r;
    }
    const meta=(equip,primary,extra)=>[equipLabel(equip)||"Other", primary?muscleLabel(primary):null, extra].filter(Boolean).join(" · ");
    const ownRow=ex=>row({name:ex.name, meta:meta(ex.equipment,ex.primary,ex.gymId&&State.gyms.length>1?gymNameOf(ex.gymId):null), imgPromise:exerciseImageId(ex), ex});
    const libRow=le=>row({name:le.name, meta:meta(le.equipment,le.primary), imgId:le.raw.id, le});
    const customBtn=()=>{ const q=search.value.trim();
      return el("button",{class:"btn secondary",style:"margin-top:10px",onClick:()=>{
        close(); openExerciseSheet(null,{prefillName:q, onCreate: async ex=>{ await opts.onAdd(ex); }});
      }}, ic("plus",16), q? `Create “${q}” as a custom exercise` : "Create a custom exercise"); };
    const CAP=60;
    function renderSearch(q){
      results.replaceChildren(); foot.replaceChildren();
      const mine=rankByMatch(q, own().filter(eqOK), e=>e.name);
      const libs=rankByMatch(q, (LIB||[]).filter(le=>eqOK(le) && libVisible(le)));
      if(!mine.length && !libs.length){
        results.append(el("p",{class:"muted small",style:"margin:8px 2px"}, LIB?"Nothing matches — create it as a custom exercise below.":"Loading the library…"));
        if(LIB) foot.append(customBtn()); return;
      }
      const mineSec=()=>{ results.append(el("div",{class:"regionhead"},"Your exercises")); mine.slice(0,CAP).forEach(e=>results.append(ownRow(e))); };
      const libsSec=()=>{ results.append(el("div",{class:"regionhead"},"From the library")); libs.slice(0,CAP).forEach(e=>results.append(libRow(e))); };
      (libLeadsSearch(q, mine, libs) ? [libs.length&&libsSec, mine.length&&mineSec] : [mine.length&&mineSec, libs.length&&libsSec]).forEach(fn=>fn&&fn());
      foot.append(el("div",{class:"small muted",style:"margin:10px 2px 0"},"Not the one you want?"), customBtn());
    }
    // exercises you did recently at this gym — the likeliest next adds
    let recentEx=[];
    (async()=>{
      const [ses, sets]=await Promise.all([DB.all("sessions"), DB.all("sets")]);
      const byDate=Object.fromEntries(ses.map(x=>[x.id,x.date]));
      const ordered=sets.slice().sort((a,b)=>(byDate[b.sessionId]||"").localeCompare(byDate[a.sessionId]||""));
      const pool=own(), seen=new Set();
      for(const x of ordered){
        const ex=State.exercises.find(e=>e.id===x.exerciseId); if(!ex)continue;
        const o=pool.find(e=>e.id===ex.id || (ex.linkId && e.linkId===ex.linkId)); if(!o||seen.has(o.id))continue;
        seen.add(o.id); recentEx.push(o); if(recentEx.length>=8) break;
      }
      if(recentEx.length && !normName(search.value)) rerender();
    })();
    function renderGroups(){
      results.replaceChildren(); foot.replaceChildren();
      const rec=recentEx.filter(eqOK);
      if(rec.length){ results.append(el("div",{class:"regionhead"},"Recent")); rec.forEach(e=>results.append(ownRow(e))); }
      REGION_ORDER.forEach(region=>{
        const mine=sortForAdd(own().filter(e=>exRegion(e)===region && eqOK(e) && !rec.includes(e)));
        const libs=(LIB||[]).filter(le=>le.region===region && eqOK(le) && libVisible(le))
          .sort((a,b)=>((LIB_STAPLES[b.raw.name]?1:0)-(LIB_STAPLES[a.raw.name]?1:0)) || a.name.localeCompare(b.name));   // staples first
        if(!mine.length && !libs.length) return;
        const det=el("details",{class:"exgroup"});
        det.append(el("summary",{}, el("span",{class:"grow",style:"font-weight:700"},region),
          ...(mine.length?[el("span",{class:"small muted"}, `${mine.length} yours`)]:[]), el("span",{class:"chev"},ic("chevron",16))));
        let built=false;
        det.addEventListener("toggle",()=>{ if(det.open && !built){ built=true;
          mine.forEach(e=>det.append(ownRow(e)));
          libs.slice(0,CAP).forEach(e=>det.append(libRow(e)));
          if(libs.length>CAP) det.append(el("div",{class:"small muted",style:"margin:6px 2px"}, `+${libs.length-CAP} more — search to find them`));
        }});
        results.append(det);
      });
      foot.append(el("div",{class:"small muted",style:"margin:12px 2px 0"},"Can't find it?"), customBtn());
    }
    const rerender=()=>{ const q=normName(search.value); q?renderSearch(q):renderGroups(); };
    search.addEventListener("input", rerender);
    rerender();
    loadLibrary().then(rerender).catch(()=>rerender());   // library is a bonus; your collection works regardless
  }, {stacked:true, onClose:()=>{ opts.afterClose&&opts.afterClose(); }});
}

/* quick add via natural language — matches what you typed against today's workout first, then your
   collection (with gym shorthand: db, bb, ohp, rdl…), and only creates a new exercise if you pick that.
   Used to exact-match only, so "incline db press" silently made a duplicate of Incline Dumbbell Press. */
function quickAddCandidates(name){
  const qt=searchTokens(name); if(!qt.length) return [];
  const inPlan=new Set((State.activeSession?.items||[]).map(i=>i.exerciseId));
  const pool=[...new Map(gymExercises().concat(State.exercises.filter(e=>inPlan.has(e.id))).map(e=>[e.id,e])).values()];
  const scored=pool.map(ex=>{ const sc=matchScore(qt,ex.name); return {ex, inPlan:inPlan.has(ex.id), score: sc>0 ? sc+(inPlan.has(ex.id)?1.5:0) : 0}; })
    .filter(c=>c.score>0).sort((a,b)=>b.score-a.score);
  const top=scored[0]?.score||0;
  return scored.filter(c=>c.score>=Math.max(2, top*0.5)).map(c=>({...c, strong: matchScore(qt,c.ex.name)>=qt.length*3+2}));
}

// parser: "<name> <weight> [x] <r1>[, <r2> ...]"
function parseNL(str){
  if(!str) return null;
  const s=str.trim().replace(/\s+/g," ");
  const m=s.match(/^([a-zA-Z][a-zA-Z\s\-/]*?)\s+(\d+(?:\.\d+)?)\s*(?:x|×|@|for)?\s*([\d,\s]+)$/i);
  if(!m) return null;
  const name=m[1].trim().replace(/\b\w/g,c=>c.toUpperCase());
  const weight=+m[2];
  const reps=m[3].split(/[,\s]+/).map(Number).filter(n=>n>0);
  if(!reps.length) return null;
  return {name,sets:reps.map(r=>({weight,reps:r}))};
}

// week bucket = the Monday of that date (local noon dodges TZ/DST slip)
function mondayOf(iso){ const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()-((d.getDay()+6)%7)); return localISO(d); }
function lastNWeeks(n){ const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); const out=[]; for(let i=n-1;i>=0;i--){ const w=new Date(d); w.setDate(d.getDate()-i*7); out.push(localISO(w)); } return out; }

// (Was a blended 1–10 score — nobody could say what moved it, so it's just the counts now.)
function liftMovement(sessions, sets){
  const sesById=Object.fromEntries(sessions.map(s=>[s.id,s])); const unit={};
  const curWk=lastNWeeks(1)[0];   // exclude the current, incomplete week
  for(const x of sets){ const ex=State.exercises.find(e=>e.id===x.exerciseId); if(!ex)continue;
    const se=sesById[x.sessionId]; if(!se||daysAgo(se.date)>28||mondayOf(se.date)===curWk)continue;
    const key=ex.linkId||ex.id, m=exMetric(ex, x.weight, x.reps);
    const u=(unit[key]=unit[key]||{}), p=(u[se.date]=u[se.date]||{v:0,rough:false});
    p.v=Math.max(p.v, m); p.rough=p.rough||isRoughDay(se); }

// pool sets into "units" (machines confirmed the same via linkId count as one) and compute
// per-session series for each: best set (exMetric), session volume and total reps.
// Shared by the Insights summary card and the Strength explorer.
function buildStrengthStats(sessions, allSets){
  const exById=id=>State.exercises.find(e=>e.id===id);
  const sesById=Object.fromEntries(sessions.map(s=>[s.id,s]));
  const unitMap={};
  allSets.forEach(x=>{ const ex=exById(x.exerciseId); if(!ex)return;
    const key=ex.linkId||ex.id;
    const u=unitMap[key]||(unitMap[key]={key, repEx:ex, sets:[], gymIds:new Set(), exIds:new Set()});
    u.sets.push(x); u.exIds.add(ex.id); if(ex.gymId) u.gymIds.add(ex.gymId);
  });
  const stats=[];
  for(const key of Object.keys(unitMap)){
    const u=unitMap[key], ex=u.repEx, bw=isBW(ex);
    const agg={};
    // load a set "counts as" for the ×n+ views: real weight; assisted machines → effective kg
    const loadOf=x=> isInverted(ex) ? (invEffectiveKg(ex, x.weight) ?? 0) : (+x.weight||0);
    u.sets.forEach(x=>{ const se=sesById[x.sessionId]; if(!se||!(x.reps>0))return;

      const a=agg[k]||(agg[k]={m:0,vol:0,thr:{},top:0,topReps:0,maxReps:0,sid:se.id,rough:isRoughDay(se)});
      a.m=Math.max(a.m, exMetric(ex, x.weight, x.reps));

      const tw=loadOf(x); if(tw>a.top || (tw===a.top && +x.reps>a.topReps)){ a.top=tw; a.topReps=+x.reps; }   // the session's top set

      const w=loadOf(x);

// windowed trend: % change of a metric across the sessions inside the window (null = <2 sessions).
// All-time first→last is misleading after a layoff — every lift shows its full regain forever.
// ROUGH DAYS can only help you, never hurt you: a tagged rough day still counts as training
// (streaks, sets, volume, history, records) and a PR on one is a real PR — it just can't count as a
// dip, a miss or a stall session. Trend ends follow the same rule: the baseline is your first NORMAL

// PRs are detected live but vanish as 2-second toasts — replay history per movement so recent
// wins stay visible. Skips each movement's first session (day one, everything is a "PR").
function recentWins(sessions, allSets){
  const exById=id=>State.exercises.find(e=>e.id===id);
  const sesById=Object.fromEntries(sessions.map(s=>[s.id,s]));
  const units={};
  allSets.forEach(x=>{ const ex=exById(x.exerciseId); if(!ex||!(x.reps>0))return;
    const se=sesById[x.sessionId]; if(!se)return;
    const key=ex.linkId||ex.id;
    const u=units[key]||(units[key]={ex, bySes:{}});
    (u.bySes[se.date+se.startedAt]=u.bySes[se.date+se.startedAt]||{date:se.date,sets:[]}).sets.push(x);
  });
  const wins=[];
  for(const key in units){
    const u=units[key], inv=isInverted(u.ex), bw=isBW(u.ex);
    const sess=Object.values(u.bySes).sort((a,b)=>a.date.localeCompare(b.date));
    let bestW=inv?Infinity:0, bestM=0, first=true;
    for(const s2 of sess){
      const ws=s2.sets.map(x=>+x.weight||0);
      const topW=inv?Math.min(...ws):Math.max(...ws);
      const topM=Math.max(...s2.sets.map(x=>exMetric(u.ex,x.weight,x.reps)));
      let label=null;
      if(!first){
        if(inv && topW<bestW) label=topW>0?`least assistance · −${topW}${u.ex.unit||"kg"}`:"first unassisted";
        else if(!inv && !bw && topW>bestW) label=`heaviest · ${topW}${u.ex.unit||"kg"}`;
        else if(topM>bestM){
          const reps=Math.max(...s2.sets.map(x=>+x.reps||0));
          const ts=topSet(s2.sets);
          label=(bw||(inv&&State.bodyweightKg==null)) ? `most reps · ${reps}`
            : isAccessory(u.ex) ? `best set · ${fmtW(ts.weight,u.ex)} × ${ts.reps}`
            : `est. 1RM · ${Math.round(topM)}${u.ex.unit||"kg"}`;
        }

      if(label) wins.push({date:s2.date, name:u.ex.name, gym:gymTag(u.ex), label});

}

// committed sets for an exercise (pooled across linked machines), each stamped with its session date
async function exerciseHistory(exId){
  let sets=[]; for(const id of linkedIds(exId)) sets=sets.concat(await DB.byIndex("sets","exerciseId",id));
  const by=Object.fromEntries((await DB.all("sessions")).map(s=>[s.id,s]));
  return sets.filter(s=>by[s.sessionId]).map(s=>({...s,date:by[s.sessionId].date})).sort((a,b)=>a.date.localeCompare(b.date));
}
function computePRs(sets, ex){
  const bw=isBW(ex), inv=isInverted(ex);
  let heaviest=0,best1rm=0,bestSetVol=0,maxReps=0,lightest=null; const repMax={},bySession={};
  for(const s of sets){ if(!(s.reps>0))continue; const w=+s.weight||0;
    heaviest=Math.max(heaviest,w); maxReps=Math.max(maxReps,s.reps);
    lightest = lightest==null ? w : Math.min(lightest,w);        // inverted: least assistance ever used
    if(!bw) best1rm=Math.max(best1rm, inv?exMetric(ex,w,s.reps):epley(w,s.reps));
    bestSetVol=Math.max(bestSetVol,w*s.reps);
    // best-at-reps: normally the heaviest for that rep count, inverted the least-assisted
    if(repMax[s.reps]==null || (inv ? w<repMax[s.reps] : w>repMax[s.reps])) repMax[s.reps]=w;
    bySession[s.sessionId]=(bySession[s.sessionId]||0)+w*s.reps; }
  return {heaviest,lightest:lightest==null?0:lightest,best1rm:Math.round(best1rm),bestSetVol:Math.round(bestSetVol),
    bestSessionVol:Math.round(Math.max(0,...Object.values(bySession),0)),maxReps,repMax,bw,inv};
}

// ordinary least squares over [{x,y}] → {slope, intercept, r2}, or null if degenerate
function olsFit(points){
  const n=points.length; if(n<2) return null;
  let sx=0,sy=0,sxx=0,sxy=0,syy=0;
  for(const p of points){ sx+=p.x; sy+=p.y; sxx+=p.x*p.x; sxy+=p.x*p.y; syy+=p.y*p.y; }
  const denom=n*sxx-sx*sx; if(!denom) return null;
  const slope=(n*sxy-sx*sy)/denom, intercept=(sy-slope*sx)/n;
  const varY=n*syy-sy*sy;
  const r2 = varY ? Math.pow(n*sxy-sx*sy,2)/(denom*varY) : 0;
  return {slope, intercept, r2};
}
// returns a PR message if (weight,reps) beats committed history for this exercise, else null
async function prCheck(ex,weight,reps){
  if(!ex||!(reps>0))return null; const hist=await exerciseHistory(ex.id); if(!hist.length)return null;
  const pr=computePRs(hist,ex);
  if(isBW(ex)) return reps>pr.maxReps? `New PR · ${reps} reps on ${ex.name}` : null;
  if(isInverted(ex)){        // progress = LESS assistance; never celebrate dialing the help up
    if(weight<pr.lightest) return `New PR · least assistance on ${ex.name} (${weight}${ex.unit||"kg"})`;
    if(weight===pr.lightest && reps>pr.maxReps)
      return `New PR · ${reps} reps at ${weight>0?`${weight}${ex.unit||"kg"} assist`:"unassisted"} on ${ex.name}`;
    return null;
  }
  if(isAccessory(ex)){   // accessories: heavier than ever, or more reps at this weight than ever — no fake 1RM
    if(weight>pr.heaviest) return `New PR · heaviest ${ex.name} (${weight}${ex.unit||"kg"})`;
    const was=Math.max(0,...hist.filter(s=>s.reps>0 && (+s.weight||0)>=weight).map(s=>+s.reps));
    return (weight>0 && reps>was) ? `New PR · ${reps} reps at ${weight}${ex.unit||"kg"} on ${ex.name}` : null;
  }
  if(epley(weight,reps)>pr.best1rm) return `New PR · best est. 1RM on ${ex.name}`;
  if(weight>pr.heaviest) return `New PR · heaviest ${ex.name} (${weight}${ex.unit||"kg"})`;
  return null;
}

// GitHub-style activity grid: last 17 weeks × 7 days, shaded by sets that day
function consistencyCard(dateCount, onDay, nWeeks){
  const weeks=nWeeks||26, d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)-(weeks-1)*7);
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const months=el("div",{style:`display:grid;grid-template-columns:repeat(${weeks},1fr);gap:2px;margin-bottom:3px`});
  const grid=el("div",{class:"cal"});
  let prevM=-1;
  for(let c=0;c<weeks;c++){
    const colStart=new Date(d); colStart.setDate(d.getDate()+c*7);
    const m=colStart.getMonth();
    const lbl=el("span",{class:"muted",style:"font-size:11px;white-space:nowrap;overflow:visible"});
    if(m!==prevM && c<weeks-2){ lbl.textContent=MON[m]; prevM=m; }   // skip a label that would clip at the right edge
    months.append(lbl);
    for(let r=0;r<7;r++){ const cell=new Date(d); cell.setDate(d.getDate()+c*7+r);
      const key=localISO(cell), n=dateCount[key]||0, lvl=n===0?0:n<7?1:n<13?2:3;
      const sq=el("i",{class:"l"+lvl+(n&&onDay?" tap":""),title:key+(n?` · ${n} sets`:"")});
      if(n&&onDay){ sq.setAttribute("role","button"); sq.setAttribute("tabindex","0"); sq.setAttribute("aria-label",`Open workout on ${key}`);
        sq.addEventListener("click",()=>onDay(key));
        sq.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onDay(key);}}); }

  return el("div",{}, months, grid, legend);
}

// workouts per week as bars, with your goal as a line (goal met → green)
function weekBars(vals, goal, labels){
  const n=vals.length, W=324, H=96, pad=4, bw=(W-pad*2)/n;
  const max=Math.max(goal||0, ...vals, 1)+0.5, Y=v=>H-16-(v/max)*(H-24);
  let bars="";
  vals.forEach((v,i)=>{ const x=pad+i*bw+bw*0.18, w=bw*0.64, y=Y(v), cur=i===n-1;
    const fill= goal && v>=goal ? "var(--accent-2)" : "var(--data)";
    bars+=`<rect x="${x.toFixed(1)}" y="${(v?y:H-17).toFixed(1)}" width="${w.toFixed(1)}" height="${(v?(H-16-y):1).toFixed(1)}" rx="3" fill="${fill}" opacity="${cur?0.55:1}"/>`;
    if(v) bars+=`<text x="${(x+w/2).toFixed(1)}" y="${(y-3).toFixed(1)}" font-size="11" fill="var(--muted)" text-anchor="middle">${v}</text>`; });
  const gl = goal ? `<line x1="${pad}" x2="${W-pad}" y1="${Y(goal).toFixed(1)}" y2="${Y(goal).toFixed(1)}" stroke="var(--text)" stroke-opacity=".55" stroke-dasharray="4,3"/>
    <text x="${W-pad}" y="${(Y(goal)-4).toFixed(1)}" font-size="11" fill="var(--text)" text-anchor="end">goal ${goal}</text>` : "";
  const xl=[0,Math.floor((n-1)/2),n-1].map(i=>`<text x="${(pad+i*bw+bw/2).toFixed(1)}" y="${H-3}" font-size="11" fill="var(--muted)" text-anchor="middle">${esc(labels[i]||"")}</text>`).join("");
  const wrap=el("div",{class:"chart",role:"img","aria-label":`Workouts per week, last ${n} weeks: ${vals.join(", ")}${goal?`; goal ${goal}`:""}`});
  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${bars}${gl}${xl}</svg>`;
  return wrap;

// every other library name gets the same house style: equipment as a suffix ("Shrug (Barbell)"),
// " - With Bands" → "(Bands)", singular ("Curls" → "Curl"), no "- Medium Grip" noise
const NAME_SINGULAR={Curls:"Curl",Rows:"Row",Raises:"Raise",Extensions:"Extension",Lunges:"Lunge",Shrugs:"Shrug",Presses:"Press",Flyes:"Fly",Flys:"Fly",
  Dips:"Dip",Squats:"Squat",Deadlifts:"Deadlift",Crunches:"Crunch",Kickbacks:"Kickback",Pulldowns:"Pulldown",Pullovers:"Pullover",Swings:"Swing",
  Pullups:"Pull-Up",Pushups:"Push-Up",Lifts:"Lift",Thrusts:"Thrust",Bridges:"Bridge",Twists:"Twist"};
function displayLibName(raw){
  if(LIB_STAPLES[raw]) return LIB_STAPLES[raw];
  let n=String(raw||"").trim().replace(/\s+/g," ");
  if(n.includes("/")) return n;                                    // compound names ("Pull-Ups/Pulldowns") stay as they are
  n=n.replace(/\s+-\s+Medium Grip$/i,"");
  n=n.replace(/\s+-\s+With\s+(.+)$/i," ($1)").replace(/\s+-\s+(.+?)\s+Attachment$/i," ($1)").replace(/\s+-\s+(.+)$/," ($1)");
  n=n.replace(/\b([A-Z][a-z]+)\b/g,w=>NAME_SINGULAR[w]||w);
  const m=n.match(/^(Smith Machine|Barbell|Dumbbell|Cable|Machine|Kettlebell|EZ-Bar|E-Z Bar)\s+(.+)$/);
  if(m && !m[2].includes("(")) n=`${m[2]} (${m[1]==="E-Z Bar"?"EZ-Bar":m[1]})`;
  return n;
}
function libToExercise(le){
  const mP = (le.primaryMuscles&&le.primaryMuscles.length)   ? mapLibMuscle(le.primaryMuscles[0])   : null;
  const mS = (le.secondaryMuscles&&le.secondaryMuscles.length)? mapLibMuscle(le.secondaryMuscles[0]) : null;
  const g = guessMuscles(le.name);
  let primary;
  if(mP) primary = (g.primary && regionOf(g.primary)===regionOf(mP)) ? g.primary : mP;  // refine within region only
  else   primary = g.primary || null;
  let secondary = mS || g.secondary || null;
  if(secondary===primary) secondary=null;
  return {name:displayLibName(le.name), equipment:libEquip(le.equipment, le.name), primary, secondary, invertProgress:guessInvert(le.name)};
}
// already in the user's collection? (scoped equip -> current gym; free weights -> global)
function libAlreadyAdded(le){ return !!libOwnedExercise(le); }
// the collection's copy of a library entry, if any (by link, clean name or original name; scoped → this gym)
function libOwnedExercise(le){
  const m=libToExercise(le), scoped=equipGymScoped(m.equipment), t=normName(m.name), t2=normName(le.name);
  return State.exercises.find(e=> (e.libId===le.id || normName(e.name)===t || normName(e.name)===t2) && (scoped ? e.gymId===State.currentGymId : e.gymId==null)) || null;
}
// create + persist a NextSet exercise from a library record
async function addLibraryExercise(le){
  const m=libToExercise(le), equipment=m.equipment;
  const rec={ id:uid(), gymId: equipGymScoped(equipment)?State.currentGymId:null, name:m.name, libId:le.id,
    unit:prefUnit(), increment:EQUIP[equipment].inc, sets:3, repMin:8, repMax:12,
    primary:m.primary, secondary:m.secondary, equipment, invertProgress:!!m.invertProgress,
    restSec:suggestRest({name:m.name, repMax:12, primary:m.primary}) };
  await DB.put("exercises", rec);
  State.exercises = await DB.all("exercises");
  return rec;
}
// lazy-load + cache the bundled catalog, enriched with NextSet mapping for display/filtering
let LIB=null;
async function loadLibrary(){
  if(LIB) return LIB;
  const res = await fetch("./exercise-library.json");
  if(!res.ok) throw new Error("HTTP "+res.status);
  const raw = await res.json();
  LIB = raw.map(le=>{ const m=libToExercise(le);
    return { raw:le, name:m.name, equipment:m.equipment, primary:m.primary, secondary:m.secondary,
             region: m.primary? regionOf(m.primary) : "Other" }; })
    .sort((a,b)=> a.name.localeCompare(b.name));
  return LIB;
}

// resolve an added exercise to its library entry (for photos + instructions): by stored libId, else by name
async function exerciseLibEntry(ex){
  if(!ex) return null;
  try{ const lib=await loadLibrary();
    if(ex.libId){ const m=lib.find(e=>e.raw.id===ex.libId); if(m) return m; }
    const t=normName(ex.name); return lib.find(e=>normName(e.name)===t || normName(e.raw.name)===t) || null;
  }catch(e){ return null; }
}
// which library id (if any) backs this exercise — stored on add, else matched by name
async function exerciseImageId(ex){
  if(!ex) return null;
  if(ex.libId) return ex.libId;

}

// best-guess library match for an unlinked exercise (token overlap + equipment), as a SUGGESTION the user confirms
function guessLibMatch(ex){
  if(!LIB || !ex) return null;
  const t=normName(ex.name); if(!t) return null;
  const toks=t.split(" ").filter(w=>w.length>2); if(!toks.length) return null;
  let best=null, bestScore=-1;
  for(const e of LIB){
    const nt=new Set(normName(e.name).split(" "));
    const overlap=toks.filter(w=>nt.has(w)).length; if(!overlap) continue;
    let score = overlap/toks.length;                       // fraction of the user's words found
    if(e.equipment===ex.equipment) score += 0.15;          // prefer the same equipment family
    score -= normName(e.name).split(" ").length*0.01;      // mild nudge toward the simpler name
    if(score>bestScore){ bestScore=score; best=e; }
  }
  return bestScore>=0.6 ? best : null;                      // only suggest a reasonably strong match
}

function openLibraryLink(ex){
