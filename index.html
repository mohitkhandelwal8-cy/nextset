<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#111827" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>NextSet</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#111827; --surface:#1F2937; --surface-2:#2D3A4D; --line:#3A4658;
    --text:#F8FAFC; --muted:#9FB0C3; --accent:#F97316; --on-accent:#0F172A;
    --data:#60A5FA;   /* charts & data viz */
    --accent-2:#22C55E; --on-accent-2:#06231A; --warn:#FBBF24; --danger:#F87171;
    /* color roles: orange = DO something (CTAs) · violet = currently SELECTED · section hues = place identity */
    --sel:#A78BFA; --on-sel:#0F172A;
    --sec-teal:#2DD4BF; --sec-green:#22C55E; --sec-pink:#F472B6; --sec-amber:#FBBF24; --on-sec:#0F172A;   /* Balance is pink: violet means 'selected' */
    --tab-bg:rgba(20,25,37,.95);
    --radius:16px; --safe-b:env(safe-area-inset-bottom,0px);
  }
  :root[data-theme="light"]{
    --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EAEEF3; --line:#D6DCE5;
    --text:#0F172A; --muted:#5B6878; --accent:#C2410C; --on-accent:#FFFFFF;   /* orange-700: white text ≈4.9:1 */
    --data:#2563EB;
    --accent-2:#15803D; --on-accent-2:#FFFFFF; --warn:#B45309; --danger:#DC2626;
    --sel:#7C3AED; --on-sel:#FFFFFF;
    --sec-teal:#0D9488; --sec-green:#16A34A; --sec-pink:#DB2777; --sec-amber:#B45309; --on-sec:#FFFFFF;
    --tab-bg:rgba(255,255,255,.95);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'Barlow',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.5;overscroll-behavior-y:none;font-variant-numeric:tabular-nums}
  h1,h2,.cond,.name,.idx{font-family:'Barlow Condensed','Barlow',sans-serif;letter-spacing:.2px}
  button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
  button,a,.listitem,input,select,textarea{touch-action:manipulation}
  button{cursor:pointer;border:none;background:none}
  button:focus-visible,a:focus-visible,[role=button]:focus-visible,
  input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  .ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
  .ic svg{display:block}
  .app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  /* solid, not frosted: on iPhone (status bar drawn over the app) a see-through bar showed the page
     scrolling blurred behind the gym name and under the clock. iOS also softens a band just below
     the status bar, so the header content sits 14px clear of it. */
  header.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
    padding:14px 16px 12px;display:flex;align-items:center;gap:10px;padding-top:max(14px,calc(env(safe-area-inset-top) + 14px))}
  .topbar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px;flex:1}
  .topgear{flex:none;width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);margin-right:-6px}
  .topgear.on{color:var(--accent)}
  .topbar .gympick{font-size:14px;min-height:36px;color:var(--text);display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);
    border:1px solid var(--line);padding:6px 10px;border-radius:999px;max-width:50%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gympick .gp-name{min-width:0;overflow:hidden;text-overflow:ellipsis}
  main{flex:1;padding:14px 16px calc(96px + var(--safe-b))}
  .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;
    background:var(--tab-bg);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding-bottom:var(--safe-b);max-width:560px;margin:0 auto}
  .tabbar button{flex:1;padding:10px 4px 8px;color:var(--muted);font-size:12px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:3px}
  .tabbar button .ic{line-height:0}
  .topbar .brand{display:flex;align-items:center;gap:8px}
  .topbar .brand .ic{color:var(--accent)}
  .tabbar button.active{color:var(--accent)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:12px}
  .card h2{font-size:18px;margin:0 0 10px;font-weight:700}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:12px}   /* 12px floor — read mid-set, at arm's length */
  .pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);
    border:1px solid var(--line);color:var(--muted)}
  .btn{background:var(--accent);color:var(--on-accent);border-radius:12px;padding:13px 16px;
    font-weight:700;width:100%;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn.secondary{background:var(--surface-2);border:1px solid var(--line);color:var(--text)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
  .btn.success-ghost{background:transparent;border:1px solid var(--accent-2);color:var(--accent-2)}
  .btn:active{transform:scale(.98)}
  .btn.sm{padding:9px 12px;width:auto;font-size:14px;border-radius:10px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface-2);
    border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--text);outline:none;line-height:normal}
  input[type=text],input[type=number]{height:46px;-webkit-appearance:none;appearance:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  /* button that behaves like a <select>: shows the current pick, ▾ opens a picker sheet */
  .selectbtn{width:100%;display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;min-height:48px;color:var(--text);cursor:pointer;text-align:left}
  .selectbtn:active{border-color:var(--sel)}
  .selectbtn .sel-ic{display:inline-flex;color:var(--muted);flex:none}
  .selectbtn .sel-name{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .selectbtn .sel-caret{display:inline-flex;color:var(--muted);flex:none;transform:rotate(90deg)}
  label.field{display:block;margin-bottom:10px}
  label.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .empty{text-align:center;color:var(--muted);padding:40px 16px}
  .empty .big{margin-bottom:10px;display:flex;justify-content:center;color:var(--muted)}
  .empty .big svg{width:42px;height:42px}
  .listitem{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left}
  .listitem .grow{flex:1;min-width:0}
  .listitem .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chev{color:var(--muted)}
  /* set logger */
  /* set table: SET · KG · REPS · ✓ — each number is − [value] +, so you can tap-step or type;
     the steppers shrink on narrow phones so "102.5" never clips (≥16px text: no iOS focus-zoom) */
  .sethead,.setrow{display:grid;grid-template-columns:22px minmax(0,1.18fr) minmax(0,1fr) 46px;gap:6px;align-items:center}
  .sethead{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:0 0 6px}
  .sethead span{text-align:center}
  .settable{margin-top:12px}
  .setrow{margin-bottom:8px}
  .setrow .idx{color:var(--muted);font-size:14px;font-weight:700;text-align:center}
  .setrow .idx.drop{color:var(--warn)}
  .lastline{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin:12px 2px 0;font-size:14px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
  .lastline .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .stepcell{--sb:38px;display:flex;align-items:stretch;height:46px;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stepcell:focus-within{border-color:var(--accent)}
  .stepcell .sbtn{flex:0 0 var(--sb);display:flex;align-items:center;justify-content:center;color:var(--muted);background:none;border:none;padding:0}
  .stepcell .sbtn:active{background:color-mix(in srgb,var(--text) 10%,transparent);color:var(--text)}
  .stepcell .numcell{flex:1;width:100%;min-width:0;height:100%;text-align:center;font-size:18px;font-weight:700;padding:0;
    background:transparent;border:none;border-radius:0;color:var(--text);font-variant-numeric:tabular-nums}
  .stepcell .numcell:focus,.stepcell .numcell:focus-visible{outline:none;box-shadow:none}
  .stepcell .numcell.target{color:var(--muted);font-weight:600}          /* the app's suggestion — not confirmed yet */
  .setrow.locked .stepcell{background:color-mix(in srgb,var(--accent-2) 8%,var(--surface-2));border-color:color-mix(in srgb,var(--accent-2) 35%,transparent)}
  .setrow.locked .sbtn{visibility:hidden}                      /* a ticked set is locked — untick to edit */
  .setrow.locked .numcell{opacity:1;color:var(--text);-webkit-text-fill-color:var(--text)}
  @media (max-width:400px){ .stepcell{--sb:34px} }
  @media (max-width:360px){
    .sethead,.setrow{gap:4px;grid-template-columns:18px minmax(0,1.2fr) minmax(0,1fr) 44px}
    .stepcell{--sb:30px}
    .stepcell .numcell{font-size:16px}
    .setrow .done{width:44px}
  }
  @media (max-width:340px){ .stepcell{--sb:26px} }
  body.has-rest main{padding-bottom:calc(170px + var(--safe-b))}   /* last rows never hide behind the rest bar */
  .grow{flex:1;min-width:0}
  .stepper{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stepper button{width:46px;height:46px;font-size:22px;color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center}
  .stepper input{height:46px;border:none;background:transparent;text-align:center;padding:0;border-radius:0;-moz-appearance:textfield}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .stepper .unit{font-size:12px;color:var(--muted);padding-right:6px}
  .setrow .done{width:46px;height:46px;border-radius:10px;background:var(--surface-2);color:var(--text);
    border:1.5px solid color-mix(in srgb,var(--accent-2) 55%,var(--line));font-size:18px;display:flex;align-items:center;justify-content:center}
  .setrow .done.on{background:var(--accent-2);border-color:var(--accent-2);color:#06231a}
  .suggestion{font-size:14px;color:var(--text);background:color-mix(in srgb,var(--accent-2) 9%,transparent);
    border-left:3px solid var(--accent-2);border-radius:8px;padding:8px 10px;margin:10px 0 4px;line-height:1.4}
  .suggestion.warn{background:color-mix(in srgb,var(--warn) 9%,transparent);border-left-color:var(--warn)}
  .rpe{display:flex;gap:6px;margin-top:6px}
  .rpe button{flex:1;font-size:15px;font-weight:600;padding:6px 4px;min-height:44px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:5px}
  .rpe button.on{background:var(--sel);border-color:var(--sel);color:var(--on-sel)}   /* a choice = selected (violet), not a CTA */
  /* modal/sheet */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;touch-action:none}
  body.modal-open{overflow:hidden}
  .sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;
    border-top:1px solid var(--line);padding:18px 16px calc(20px + var(--safe-b));max-height:88vh;overflow:auto;overscroll-behavior:contain;touch-action:auto;animation:up .2s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h2{margin:0;font-size:17px}
  .grabber{width:40px;height:4px;border-radius:999px;background:var(--line);margin:2px auto 14px}
  .sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .sheetclose{width:44px;height:44px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
  /* centred with left/right/margin, not translateX — the entry animation sets transform and would undo it */
  .toast{position:fixed;bottom:calc(86px + var(--safe-b));left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);padding:10px 16px;display:flex;align-items:center;gap:12px;
    border-radius:16px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:up .2s}
  body.has-rest .toast{bottom:calc(150px + var(--safe-b))}   /* stack above the rest bar, never on it */
  body.modal-open .toast{bottom:calc(120px + var(--safe-b))}  /* clear a sheet's sticky footer */
  .toast-undo{color:var(--accent);font-weight:800;font-size:14px;padding:4px 2px;min-height:32px;flex:none}
  .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  /* rest timer — floats just above the tab bar, persists across tabs/re-renders */
  .restbar{position:fixed;bottom:calc(70px + var(--safe-b));left:0;right:0;margin:0 auto;
    width:min(calc(100% - 24px),520px);background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
    z-index:55;box-shadow:0 8px 24px rgba(0,0,0,.4);overflow:hidden;animation:up .2s}
  .restbar.done{border-color:var(--accent-2)}
  .restfill{height:3px;background:var(--accent);transition:width .25s linear}
  .restbar.done .restfill{background:var(--accent-2)}
  .restrow{display:flex;align-items:center;gap:10px;padding:9px 12px}
  .restlbl{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-transform:uppercase;letter-spacing:.4px}
  .resttime{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text)}
  .restbar.done .resttime{color:var(--accent-2)}
  .restbtn{flex:none;min-width:44px;height:40px;padding:0 10px;border-radius:9px;background:var(--surface);
    border:1px solid var(--line);color:var(--text);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
  /* cross-tab "workout in progress" reminder */
  .inprogress-pill{position:sticky;top:calc(var(--tb,57px) + 6px);z-index:18;width:100%;display:flex;align-items:center;gap:10px;
    margin-bottom:12px;padding:11px 14px;border-radius:12px;background:var(--surface);color:var(--text);
    border:1.5px solid var(--accent);font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.28)}
  .inprogress-pill .ipdot{background:var(--accent)}
  .inprogress-pill #elapsedClock{color:var(--accent)}
  .ipdot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .card.upcoming{padding:13px 14px;opacity:.9;cursor:pointer}
  .card.upcoming:active{opacity:1}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:8px 14px;min-height:44px;border-radius:999px;
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);margin:0 6px 8px 0}
  .chip.add{border-style:dashed;color:var(--accent)}
  .insight{border-left:3px solid var(--line);padding:8px 0 8px 12px;margin-bottom:12px}   /* neutral rail — orange means 'do something' */
  .insight.good{border-color:var(--accent-2)} .insight.warn{border-color:var(--warn)}
  .insight .t{font-weight:700;font-size:15px} .insight .d{font-size:14px;color:var(--muted);line-height:1.45}
  .divider{height:1px;background:var(--line);margin:12px 0}
  .hidden{display:none!important}
  a{color:var(--accent)}
  .mtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .mtag{display:inline-flex;align-items:center;font-size:12px;padding:3px 9px;border-radius:999px;
    background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .mtag.primary{color:var(--text);background:var(--surface-2);border-color:var(--line);font-weight:600}
  .mtag:not(.primary){background:transparent}
  .regionhead{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:16px 4px 8px}
  .regionhead:first-child{margin-top:4px}
  /* top-level section title — one step above .regionhead sub-labels */
  .sectionhead{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.01em;margin:20px 2px 10px}
  .sectionhead:first-child{margin-top:2px}
  .vbar{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .vbar .lbl{width:96px;font-size:14px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vbar .track{flex:1;height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
  .vbar .fill{height:100%;background:var(--data);border-radius:999px;min-width:3px}
  .vbar .val{width:34px;text-align:right;font-size:13px;color:var(--muted);flex:none}
  .filterchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
  .fchip{flex:none;font-size:13px;padding:7px 13px;min-height:40px;border-radius:999px;background:var(--surface-2);
    border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center}
  .fchip.on{color:var(--on-sel);background:var(--sel);border-color:var(--sel);font-weight:600}
  /* exercise demo photos (free-exercise-db) */
  .exthumb{position:relative;width:46px;height:46px;flex:none;border-radius:8px;overflow:hidden;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
  .exthumb .ic{position:absolute;color:var(--muted);opacity:.45}
  .exthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--surface-2)}
  .exthumb[role=button]{cursor:zoom-in}
  .exshots{display:flex;gap:8px;margin:0 0 14px}
  .exshot{flex:1;min-width:0;position:relative;aspect-ratio:3/2;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2);cursor:zoom-in}
  .exshot img{width:100%;height:100%;object-fit:cover;display:block}
  .exshot-zoom{position:absolute;right:6px;bottom:6px;width:26px;height:26px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center}
  /* full-screen photo viewer */
  .lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.97);overflow-y:auto;overscroll-behavior:contain;
    padding:max(12px,env(safe-area-inset-top)) 14px calc(16px + var(--safe-b));animation:fade .15s ease}
  .lightbox .lbhead{position:sticky;top:0;z-index:1;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;padding:6px 0 12px}
  .lightbox .lbhead .name{font-weight:700;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lightbox .lbclose{flex:none;width:40px;height:40px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center}
  .lightbox figure{margin:0 0 16px}
  .lightbox figcaption{color:rgba(255,255,255,.75);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin:0 2px 6px}
  .lightbox img{width:100%;border-radius:14px;background:var(--surface-2);display:block}

<script>
"use strict";
/* ---------- theme (System / Light / Dark) ---------- */
const prefersLight = () => { try{ return window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches; }catch(e){ return false; } };
const getTheme = () => { try{ return localStorage.getItem("nextset-theme") || "dark"; }catch(e){ return "dark"; } };
let resolvedTheme = (getTheme()==="light" || (getTheme()==="system" && prefersLight())) ? "light" : "dark";
function applyTheme(){
  const pref=getTheme();
  resolvedTheme = (pref==="light" || (pref==="system" && prefersLight())) ? "light" : "dark";
  try{ document.documentElement && document.documentElement.setAttribute("data-theme", resolvedTheme); }catch(e){}
  try{ const m=document.querySelector('meta[name=theme-color]'); if(m&&m.setAttribute) m.setAttribute("content", resolvedTheme==="light"?"#F4F6F9":"#111827"); }catch(e){}
}
function setTheme(pref){ try{ localStorage.setItem("nextset-theme", pref); }catch(e){} applyTheme(); render(); }
try{ document.documentElement && document.documentElement.setAttribute("data-theme", resolvedTheme); }catch(e){}   // set before first paint to avoid a flash
/* ============================================================
   NextSet — local-first gym tracker (single-file PWA)
   Data: IndexedDB. No network required.
   ============================================================ */

/* ---------- tiny DB layer (IndexedDB) ---------- */
const DB = (() => {
  const NAME = "nextset", VER = 2;
  let db = null;
  const STORES = {
    gyms:      { key:"id" },
    exercises: { key:"id", idx:[["gymId","gymId"]] },     // a "machine" at a gym
    sessions:  { key:"id", idx:[["gymId","gymId"]] },
    sets:      { key:"id", idx:[["sessionId","sessionId"],["exerciseId","exerciseId"]] },
    plans:     { key:"id", idx:[["gymId","gymId"]] },     // a saved, reusable workout (list of exercises)
    meta:      { key:"k" },
  };
  function open(){
    return new Promise((res,rej)=>{
      const r = indexedDB.open(NAME,VER);
      r.onupgradeneeded = e=>{
        const d = e.target.result;
        for(const [name,cfg] of Object.entries(STORES)){
          if(!d.objectStoreNames.contains(name)){
            const s = d.createObjectStore(name,{keyPath:cfg.key});
            (cfg.idx||[]).forEach(([n,kp])=>s.createIndex(n,kp,{unique:false}));
          }
        }
      };
      r.onsuccess = ()=>{db=r.result;res(db)};
      r.onerror = ()=>rej(r.error);
    });
  }
  function tx(store,mode="readonly"){return db.transaction(store,mode).objectStore(store);}
  const put = (store,val)=>new Promise((res,rej)=>{const r=tx(store,"readwrite").put(val);r.onsuccess=()=>res(val);r.onerror=()=>rej(r.error);});
  const del = (store,key)=>new Promise((res,rej)=>{const r=tx(store,"readwrite").delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
  const get = (store,key)=>new Promise((res,rej)=>{const r=tx(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
  const all = (store)=>new Promise((res,rej)=>{const r=tx(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});
  const byIndex = (store,idx,val)=>new Promise((res,rej)=>{const r=tx(store).index(idx).getAll(val);r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});
  return {open,put,del,get,all,byIndex};
})();

/* ---------- helpers ---------- */
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : "id-"+Date.now().toString(36)+"-"+Math.floor(performance.now()*1000).toString(36));
const $ = (sel,root=document)=>root.querySelector(sel);
const el = (tag,props={},...kids)=>{
  const n=document.createElement(tag);
  for(const[k,v] of Object.entries(props)){
    if(k==="class")n.className=v;
    else if(k==="html")n.innerHTML=v;
    else if(k.startsWith("on"))n.addEventListener(k.slice(2).toLowerCase(),v);
    else if(v!==false&&v!=null)n.setAttribute(k,v);
  }
  kids.flat().forEach(c=>n.append(c?.nodeType?c:document.createTextNode(c)));
  return n;
};
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// LOCAL calendar date (YYYY-MM-DD). Never toISOString() — that's the UTC date, which puts a
// 6:30pm Los Angeles workout on tomorrow and a 5am India workout on yesterday.
const localISO = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const todayISO = () => localISO();
const fmtDate = iso => new Date(iso+"T00:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
const daysAgo = iso => Math.floor((Date.now()-new Date(iso+"T00:00:00").getTime())/864e5);
// toast — optional {undo:fn} adds an Undo button and keeps it up longer (reversible deletes use this, not confirm())
function toast(msg, opts={}){
  const host=$("#toastHost"); host.innerHTML="";
  const t=el("div",{class:"toast",role:"status"}, el("span",{},msg));
  let timer;
  if(opts.undo){
    t.classList.add("has-undo");
    t.append(el("button",{class:"toast-undo",onClick:async()=>{ clearTimeout(timer); t.remove(); await opts.undo(); }},"Undo"));
  }
  host.append(t);
  timer=setTimeout(()=>t.remove(), opts.undo?5000:2200);
}
/* ---------- rest timer ----------
   The bar is built ONCE and only its text/width change each tick — rebuilding it every 250ms
   restarted its entry animation (which overrode its centring, pushing it half off-screen) and
   re-announced the live region four times a second. */
let _rest=null;  // {endsAt, total, label, iv, fired, els}
let _audioCtx=null;
const restSoundOn = () => State.restSound===true;   // off unless you turn it on (Settings → Rest timer)
// iOS only allows audio that was unlocked inside a user gesture — the set ✓ tap that starts the rest is one
function primeAudio(){ try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; if(!_audioCtx) _audioCtx=new AC(); if(_audioCtx.state==="suspended") _audioCtx.resume(); }catch(e){} }
// a soft two-note chime that fades out — not an alarm beep
function restBeep(){
  try{ if(!_audioCtx) return; const t0=_audioCtx.currentTime;
    [[0,659],[0.18,880]].forEach(([off,hz])=>{ const o=_audioCtx.createOscillator(), g=_audioCtx.createGain();
      o.type="sine"; o.frequency.value=hz; g.gain.setValueAtTime(0.0001,t0+off);
      g.gain.exponentialRampToValueAtTime(0.09,t0+off+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t0+off+0.6);
      o.connect(g).connect(_audioCtx.destination); o.start(t0+off); o.stop(t0+off+0.62); });
  }catch(e){}
}
function stopRest(){ if(_rest){ clearInterval(_rest.iv); _rest=null; } const h=$("#restHost"); if(h) h.innerHTML=""; document.body.classList.remove("has-rest"); updateRestPill(); }
function startRest(sec, label){
  if(!(sec>0)) return;
  stopRest();
  if(restSoundOn()) primeAudio();
  _rest={ endsAt: Date.now()+sec*1000, total: sec, label: label||"" };
  const host=$("#restHost");
  const els={ fill:el("div",{class:"restfill"}), lbl:el("span",{class:"restlbl"}), time:el("span",{class:"resttime"}),
    skip:el("button",{class:"restbtn","aria-label":"Skip rest",onClick:stopRest}, ic("x",16)), live:el("span",{class:"sr-only","aria-live":"polite"}) };
  const bar=el("div",{class:"restbar",role:"group","aria-label":"Rest timer"}, els.fill,
    el("div",{class:"restrow"}, els.lbl, els.time,
      el("button",{class:"restbtn","aria-label":"Add 30 seconds",onClick:()=>{ if(!_rest)return; _rest.endsAt+=30000; _rest.total+=30; _rest.fired=false; renderRest(); }},"+30s"),
      els.skip), els.live);
  _rest.els=els; _rest.bar=bar;
  host.replaceChildren(bar); document.body.classList.add("has-rest");
  renderRest();
  _rest.iv=setInterval(renderRest, 250);
}
const restLeftStr = () => { if(!_rest) return ""; const left=Math.max(0,Math.ceil((_rest.endsAt-Date.now())/1000)); return `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`; };
function renderRest(){
  if(!_rest||!_rest.els) return;
  const {els,bar}=_rest;
  const leftMs=_rest.endsAt-Date.now(), done=leftMs<=0;
  const pct=Math.max(0,Math.min(1, _rest.total? leftMs/(_rest.total*1000):0));
  els.fill.style.width=Math.round(pct*100)+"%";
  els.lbl.textContent = done? "Rest done — next set" : ("Rest"+(_rest.label?" · "+_rest.label:""));
  els.time.textContent = done? "Go" : restLeftStr();
  bar.classList.toggle("done", done);
  updateRestPill();
  if(done && !_rest.fired){ _rest.fired=true;
    els.live.textContent="Rest done — time for your next set";
    els.skip.setAttribute("aria-label","Dismiss"); els.skip.replaceChildren(ic("check",16));
    if(restSoundOn()){ restBeep(); try{ navigator.vibrate && navigator.vibrate(120); }catch(_){} }
    setTimeout(()=>{ if(_rest&&_rest.fired&&Date.now()>=_rest.endsAt) stopRest(); }, 6000); }   // auto-clear a few seconds after it rings
}
// the "Workout in progress" pill on other tabs shows the rest countdown too
function updateRestPill(){ const p=document.getElementById("restPillClock"); if(!p) return;
  if(_rest && Date.now()<_rest.endsAt){ p.textContent="Rest "+restLeftStr(); p.style.display=""; } else { p.textContent=""; p.style.display="none"; } }
function round(n,step){ return Math.round(n/step)*step; }
function epley(w,r){ return w*(1+r/30); } // est 1RM for trend
const APP_VERSION = "v107"; // keep in sync with CACHE in sw.js

/* ---------- inline SVG icons (Lucide-style, no emoji) ---------- */
const ICONS = {

        if(!le || normName(ex.name)!==normName(le.raw.name)) continue;      // renamed by you → keep

const setMeta = (k,v)=>DB.put("meta",{k,v});

const curGym = ()=>State.gyms.find(g=>g.id===State.currentGymId)||null;
// a gym's exercises = its gym-scoped machines/cables + all global (free-weight/bodyweight) exercises

// resolve a plan's stored exercise to the equivalent at a given gym:

const templateMinutes = plan => plan.items.reduce((t,it)=>{ const ex=State.exercises.find(e=>e.id===it.exerciseId); return t + exMinutes(ex, it.sets); },0) + BETWEEN_REST_MIN*Math.max(0, plan.items.length-1);
function planRegions(plan){ return [...new Set(plan.items.map(it=>{const ex=State.exercises.find(e=>e.id===it.exerciseId);return ex?exRegion(ex):null;}).filter(r=>r&&r!=="Other"))]; }
function suggestPlanName(items){ const regs=[...new Set(items.map(it=>{const ex=State.exercises.find(e=>e.id===it.exerciseId);return ex?exRegion(ex):null;}).filter(r=>r&&r!=="Other"))]; return regs.length? regs.slice(0,2).join(" & ") : "My plan"; }
const normName = s => (s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
// exercise-name search: token-ranked + a few synonyms so "hip abduction" finds "Thigh Abductor",
// "seated leg press" finds "Leg Press", etc. (a literal substring match was missing these).
// synonyms + gym shorthand, so "db press" finds dumbbell presses and "pull up" finds Pullups
const SEARCH_ALIAS={abductor:"abduct",abduction:"abduct",adductor:"adduct",adduction:"adduct",
  db:"dumbbell",dbs:"dumbbell",bb:"barbell",kb:"kettlebell",ohp:"overhead press",rdl:"romanian deadlift",
  pullup:"pull up",pullups:"pull up",chinup:"chin up",chinups:"chin up",pushup:"push up",pushups:"push up",
  situp:"sit up",situps:"sit up",flye:"fly",flyes:"fly",flys:"fly",calves:"calf",skullcrusher:"skull crusher",
  skullcrushers:"skull crusher",lats:"lat",tris:"tricep",bis:"bicep",delts:"delt",pec:"pec"};

function matchScore(qt, name){

  for(const w of qt){ if(nt.includes(w)){ sc+=3; hits++; } else if(nt.some(x=>x.startsWith(w))){ sc+=1; hits++; } }
  if(!hits) return 0;
  if(hits===qt.length) sc+=2;

  const top=Math.max(0,...scored.map(x=>x[1]));

const libLeadsSearch = (q, mine, libs) => {

const gymNameOf = id => State.gyms.find(g=>g.id===id)?.name || "";

// KEY LIFTS — the starred handful you care most about (stored as ex.fav, shared by the same machine

function keyLiftExercises(){ const seen=new Set(), out=[];

/* ============================================================
   PROGRESSION ENGINE  (double progression + RPE modifier)
   ============================================================ */
async function lastSetsFor(exerciseId, beforeSessionId=null, skipIds=null){
  let sets=[];
  for(const id of linkedIds(exerciseId)) sets=sets.concat(await DB.byIndex("sets","exerciseId",id));
  if(!sets.length) return null;
  // group by session, find most recent completed session (excluding current)
  const bySession = {};
  for(const s of sets){ (bySession[s.sessionId]=bySession[s.sessionId]||[]).push(s); }
  const sessions = await DB.all("sessions");
  const order = sessions.filter(se=>bySession[se.id] && se.id!==beforeSessionId && !(skipIds&&skipIds.has(se.id)))
    .sort((a,b)=> (b.date+b.startedAt).localeCompare(a.date+a.startedAt));
  if(!order.length) return null;
  const last = order[0];
  const ls = bySession[last.id].filter(s=>s.reps>0).sort((a,b)=>a.order-b.order);
  return ls.length ? {session:last, sets:ls} : null;
}
// How many consecutive recent sessions stalled at the same top weight
async function stallCount(exerciseId){
  let sets=[];
  for(const id of linkedIds(exerciseId)) sets=sets.concat(await DB.byIndex("sets","exerciseId",id));
  const sessions = (await DB.all("sessions"));
  const bySession={};
  for(const s of sets){ if(s.reps>0)(bySession[s.sessionId]=bySession[s.sessionId]||[]).push(s); }
  const ordered = sessions.filter(se=>bySession[se.id])
    .sort((a,b)=>(b.date+b.startedAt).localeCompare(a.date+a.startedAt));
  const ex0=State.exercises.find(e=>e.id===exerciseId);
  let topWeights = ordered.map(se=>workLoad(ex0, bySession[se.id].map(x=>x.weight)));   // inverted: least assistance
  let n=0; for(let i=1;i<topWeights.length;i++){ if(topWeights[i]===topWeights[0])n++; else break; }
  return n; // sessions before today at same top weight
}

// How aggressively to grow volume each session (user setting, %). Default 4 — this is a "Solid" session.
function volTarget(){ const v=State.volTargetPct; return Number.isFinite(v)&&v>0 ? v : 4; }
// autoregulation: scale that target by how the last session felt. Easy ~2.5× (push), Grind ~0.5× (ease),
// Solid/unrated = baseline. Capped so a high baseline can't run away.
function rpeTargetPct(baseline, rpes){
  const r=(rpes||[]).filter(Boolean);
  if(r.includes("grind")) return Math.max(1, Math.round(baseline*0.5*10)/10);
  if(r.length && r.every(x=>x==="easy")) return Math.min(12, Math.round(baseline*2.5*10)/10);
  return baseline;
}

async function suggestNext(ex, opts={}){   // opts.peek: read-only preview (Today's "Up next"), never consumes a scheduled deload
  const lastPrev = await lastSetsFor(ex.id, State.activeSession?.id);
  let prev = lastPrev;
  // ROUGH DAY: last session was tagged (slept badly, sick, low on time…) AND fell short of the session
  // before it → it doesn't count. Plan from the last normal session, and don't let that miss count
  // toward "holding". If you did fine despite the tag, nothing changes.
  let rough=null;
  if(prev && isRoughDay(prev.session)){
    const skip=new Set([prev.session.id]); let earlier=null;
    for(let k=0;k<6;k++){ earlier=await lastSetsFor(ex.id, State.activeSession?.id, skip);
      if(!earlier || !isRoughDay(earlier.session)) break; skip.add(earlier.session.id); }
    const best=a=>Math.max(0,...a.map(x=>exMetric(ex,x.weight,x.reps))), vol=a=>a.reduce((t,x)=>t+(+x.weight||0)*(+x.reps||0),0);
    const rec=await getMeta(progKey(ex));
    const missed = (rec && rec.streak>=1 && rec.date===prev.session.date) || (earlier && (best(prev.sets)<best(earlier.sets)*0.995 || vol(prev.sets)<vol(earlier.sets)*0.98));
    if(earlier && missed){ rough={tags:roughTags(prev.session), from:earlier.session.date, streakOff:(rec&&rec.date===prev.session.date)?1:0}; prev=earlier; }
  }
  const withRough = r => !rough ? r : {...r, prev:lastPrev, excused:true,
    note:`Last time was a rough day (${rough.tags.join(", ").toLowerCase()}), so it doesn't count — planning from ${fmtDate(rough.from)} instead. `
      +(r.note||"").replace("Last time felt easy","That one felt easy").replace("Last time was a grind","That one was a grind")
        .replace("Came up short last time","Came up short then").replace("Beat last time:","Beat it:")};
  const sets = Math.max(1, ex.sets||3);
  const repMin = ex.repMin||8, repMax = ex.repMax||12, inc = ex.increment||2.5;
  // equivalent-machine mapping (hint, never override): no recent own history, but the linked
  // machine at the other gym has one + a calibration ratio → map its plan through the ratio.
  // Inert unless the user linked machines as equivalent (ex.equivId).
  if(ex.equivId && (!prev || daysAgo(prev.session.date)>21)){
    const other=equivOther(ex), rate=calibRateFor(ex);
    if(other && rate){
      const oPrev=await lastSetsFor(other.id, State.activeSession?.id);
      if(oPrev && daysAgo(oPrev.session.date)<=21){
        // the equivalent's own suggested plan (volume model, no meta side effects), then convert
        const oSets=Math.max(1,other.sets||3), oInc=other.increment||2.5;
        const baseO=Math.max(0,...oPrev.sets.map(s2=>+s2.weight||0));
        let oPlan=null;
        if(baseO>0){
          const streakO=(await getMeta(progKey(other)))?.streak || 0;
          if(streakO>=1) oPlan=normalizeSeed(oPrev.sets, oSets).seed;
          else oPlan=volumeProgress(oPrev.sets,{sets:oSets,repMin:other.repMin||8,repMax:other.repMax||12,inc:oInc,pct:rpeTargetPct(volTarget(), oPrev.sets.map(s2=>s2.rpe))}).plan;
        }
        if(oPlan){
          const mapped=oPlan.map(p=>({weight:Math.max(0, round(p.weight*rate, inc)), reps:Math.max(repMin, Math.min(repMax, p.reps)), target:p.reps}))
            .sort((a,b)=> a.weight-b.weight || b.reps-a.reps);
          const topO=Math.max(...oPlan.map(p=>p.weight)), topM=Math.max(...mapped.map(p=>p.weight));
          return { plan: mapped, kind:"mapped", prev,
            note:`Based on ${other.name} at ${gymNameOf(other.gymId)||"your other gym"} (${fmtW(topO,other)} there) — ≈ ${fmtW(topM,ex)} here. First time mapping, so treat it as a starting point.` };
        }
      }
    }
  }
  if(!prev){
    return { plan: Array.from({length:sets},()=>({weight:0,reps:repMin,target:repMin})),
             note: isBW(ex)?"First time — log your reps and I'll progress them next time.":"First time on this — log a working set and I'll progress it next time.", kind:"new" };
  }
  // deload the user scheduled from Insights — consumed once, and only exists because they tapped it
  const adjKey="pendingAdjust:"+(ex.linkId||ex.id);
  const adj=await getMeta(adjKey);
  if(adj && adj.type==="deload"){
    if(!opts.peek) await DB.del("meta",adjKey);
    const pct=(adj.pct||10)/100;
    const top=workLoad(ex, prev.sets.map(s=>+s.weight||0));
    // on an assisted machine "easier" means MORE help, so a deload moves the number up, not down
    const dw=Math.max(0, round(isInverted(ex) ? top*(1+pct) : top*(1-pct), inc));
    return { plan: Array.from({length:sets},()=>({weight:dw,reps:repMin,target:repMin})),
             note: isInverted(ex)
               ? `Deload you scheduled from Insights — more assistance (${fmtW(dw,ex)}) to rebuild from.`
               : "Deload you scheduled from Insights — rebuild from here.", kind:"deload", prev };
  }
  // assisted machines run on a backwards scale — their own mirrored double progression
  if(isInverted(ex)) return withRough(await invertedNext(ex, prev, {sets,repMin,repMax,inc}));
  // pure bodyweight / sled-only (no working load → can't compute volume) keeps classic double progression
  const base = Math.max(0, ...prev.sets.map(s=>+s.weight||0));
  if(base<=0) return withRough(await classicNext(ex, prev, {sets,repMin,repMax,inc}));
  // weighted bodyweight (e.g. +10kg dips): solve on implied TOTAL load (bodyweight×coef + added), so
  // a +4% target is +4% of true stimulus — then convert the plan back to added load for logging.
  // Bodyweight enters as a CONSTANT (never the drifting calibrated levelKg); unset → old behavior.
  const bwBase = (isBW(ex) && State.bodyweightKg>0) ? State.bodyweightKg*bwCoef(ex.name) : 0;
  const seedSets = bwBase ? prev.sets.map(s=>({...s, weight:(+s.weight||0)+bwBase})) : prev.sets;
  const toAdded = p => bwBase ? p.map(s=>({...s, weight:round(Math.max(0, s.weight-bwBase), inc)})) : p;
  // weighted → volume model. If you fell short of the target last time, HOLD (no progression);
  // two short sessions running → ease back ~10% to rebuild. Otherwise climb by your target %.
  const pl = isPlate(ex);
  const streak = Math.max(0, ((await getMeta(progKey(ex)))?.streak || 0) - (rough?rough.streakOff:0));
  let plan, note, kind, targetVol;
  if(streak>=1){
    // missed last time → hold the same target and keep trying until you hit it (no auto-deload)
    const {seed,Vlast} = normalizeSeed(seedSets, sets);
    plan = toAdded(seed.map(s=>({weight:s.weight,reps:s.reps}))); targetVol = Vlast; kind = "hold";
    note = streak>=3
      ? `Still holding — ${streak} sessions at this target. Stick with it; if it's truly stuck, ease the weight down a notch yourself.`
      : `Came up short last time — same weights and reps again. Nail every set and we add load next.`;
  } else {
    // autoregulate the target by how the last session felt (Easy → push, Grind → ease)
    const baseline = volTarget(), pct = rpeTargetPct(baseline, prev.sets.map(s=>s.rpe));
    const feel = pct>baseline ? "Last time felt easy — let's push. " : pct<baseline ? "Last time was a grind — easing off a touch. " : "";
    const r = volumeProgress(seedSets, {sets,repMin,repMax,inc,pct});
    plan = toAdded(r.plan); targetVol = r.Vnew;
    kind = r.weightAdded ? "weight" : (r.repAdded ? "rep" : "repeat");
    const top = Math.max(...plan.map(s=>s.weight));
    if(r.weightAdded){
      const rs=[...new Set(plan.map(s=>s.reps))].sort((a,b)=>a-b);
      note = `You hit ${repMax} on every set — add weight: ${fmtW(top,ex)}${(pl||bwBase)?" added":""} × ${rs.join("–")}, then build the reps back up.`;
    } else if(r.repAdded){
      const {seed} = normalizeSeed(seedSets, sets);
      const extra = Math.max(1, Math.round(r.plan.reduce((t,s)=>t+s.reps,0) - seed.reduce((t,s)=>t+s.reps,0)));
      note = `${feel}Beat last time: same weights, ${extra>1?`${extra} more reps`:"one more rep"} than before.`;
    } else {
      note = `${feel}Match last time, then we'll add load.`;
    }
  }
  const outPlan = plan.map(s=>({weight:s.weight, reps:s.reps, target:s.reps}))
    .sort((a,b)=> a.weight-b.weight || b.reps-a.reps);   // clean display order (not 10/9/10); keeps the completion pull-up safe
  // own history wins — but if the equivalent machine's NEWER sessions disagree by >10%, say so
  if(ex.equivId){
    const other=equivOther(ex), rate=calibRateFor(ex);
    if(other && rate){
      const oPrev=await lastSetsFor(other.id, State.activeSession?.id);
      if(oPrev && oPrev.session.date>prev.session.date){
        const mappedTop=round(Math.max(0,...oPrev.sets.map(s2=>+s2.weight||0))*rate, inc);
        const ownTop=Math.max(0,...outPlan.map(s2=>s2.weight));
        if(ownTop>0 && mappedTop>ownTop*1.1)
          note+=` Your ${gymNameOf(other.gymId)||"other gym"} sessions suggest you're stronger than this — try ${fmtW(mappedTop,ex)} if it feels light.`;
      }
    }
  }
  return withRough({ plan: outPlan, note, kind, prev, targetVol, bwBase: bwBase||null });
}

// classic double progression — used for bodyweight & sled-only, where true volume isn't computable
async function classicNext(ex, prev, {sets,repMin,repMax,inc}){
  const workW = Math.max(...prev.sets.map(s=>s.weight));
  const atWork = prev.sets.filter(s=>s.weight===workW);
  const repsAt = atWork.map(s=>s.reps);
  const minReps = Math.min(...repsAt), maxReps = Math.max(...repsAt);
  const allTop = repsAt.every(r=>r>=repMax);
  const rpe = atWork.map(s=>s.rpe).filter(Boolean);
  const allEasy = rpe.length===atWork.length && rpe.every(r=>r==="easy");
  const anyGrind = rpe.some(r=>r==="grind");
  const bw = isBW(ex);
  const loadStr = w => bw ? ((+w)>0 ? `+${fmtW(w,ex)}` : "bodyweight")
    : (isPlate(ex)&&(+w)===0 ? "sled only" : fmtW(w,ex));
  let plan, note, kind="rep";
  if(allTop || (allEasy && minReps>=Math.floor((repMin+repMax)/2))){
    const w = round(workW+inc, inc);
    plan = Array.from({length:sets},()=>({weight:w,reps:repMin,target:repMin}));
    note = `${bw?"Add load":"Add weight"} → ${loadStr(w)} × ${repMin} — up from ${loadStr(workW)} last time. You ${allTop?`hit ${repMax}+ ${bw?"reps":"on every set"}`:"left reps in the tank"}.`;
    kind="weight";
  } else if(minReps>=repMin){
    const tgt = Math.min(maxReps+1, repMax);
    plan = Array.from({length:sets},()=>({weight:workW,reps:tgt,target:tgt}));
    note = `${bw? (workW>0?loadStr(workW):"Bodyweight") : (isPlate(ex)&&workW===0?"Sled only":`Same weight ${fmtW(workW,ex)}`)} → push for ${tgt} reps.${anyGrind?" (last set was a grind — only if it moves.)":""}`;
  } else {
    plan = Array.from({length:sets},()=>({weight:workW,reps:repMin,target:repMin}));
    note = `${bw?`Repeat ${loadStr(workW)} for ${repMin} reps`:`Repeat ${fmtW(workW,ex)} × ${repMin}`} — you missed the bottom of the range last time.`;
    kind="repeat";
    const stalls = await stallCount(ex.id);
    if(stalls>=2 && !((bw||isPlate(ex)) && workW===0)){
      const dw = round(workW*0.9, inc);
      note = `${bw?`Stalled ${stalls+1} sessions at ${loadStr(workW)}. Drop to ${loadStr(dw)}`:`Stalled ${stalls+1} sessions at ${fmtW(workW,ex)}. Consider a deload to ${fmtW(dw,ex)}`} and rebuild.`;
      kind="deload";
      plan = Array.from({length:sets},()=>({weight:dw,reps:repMin,target:repMin}));
    }
  }
  return {plan,note,kind,prev};
}

/* Mirrored double progression for assisted machines. The logged number is ASSISTANCE, so the
   working set is the LEAST-assisted one and progress means taking that number DOWN toward 0.
   Volume/tonnage is meaningless on this scale (less weight = more work), so — like bodyweight
   and sled-only — this stays a pure reps-then-load ladder and returns no targetVol. */
async function invertedNext(ex, prev, {sets,repMin,repMax,inc}){
  const weights = prev.sets.map(s=>+s.weight||0);
  const workW = Math.min(...weights);                 // least assistance used = the hard sets
  const atWork = prev.sets.filter(s=>(+s.weight||0)===workW);
  const repsAt = atWork.map(s=>s.reps);
  const minReps = Math.min(...repsAt), maxReps = Math.max(...repsAt);
  const allTop = repsAt.every(r=>r>=repMax);
  const rpe = atWork.map(s=>s.rpe).filter(Boolean);
  const allEasy = rpe.length===atWork.length && rpe.every(r=>r==="easy");
  const anyGrind = rpe.some(r=>r==="grind");
  const loadStr = w => (+w)>0 ? `${fmtW(w,ex)} assist` : "unassisted";
  const mk = (w,r) => Array.from({length:sets},()=>({weight:w,reps:r,target:r}));
  let plan, note, kind="rep";
  if(allTop || (allEasy && minReps>=Math.floor((repMin+repMax)/2))){
    if(workW<=0){
      // already unassisted and hitting the top of the range — the machine has nothing left to give
      const tgt = Math.min(maxReps+1, repMax);
      plan = mk(0, tgt); kind="rep";
      note = `You're doing these unassisted for ${repMax}+ reps — the machine's done its job. Move to real pull-ups, or start adding load with a belt.`;
    } else {
      const w = Math.max(0, round(workW-inc, inc));
      plan = mk(w, repMin); kind="weight";
      note = w>0
        ? `Less help → ${loadStr(w)} × ${repMin}, down from ${loadStr(workW)} last time. You ${allTop?`hit ${repMax}+ on every set`:"left reps in the tank"}.`
        : `Drop the assistance entirely — try these unassisted for ${repMin}. You ${allTop?`hit ${repMax}+ on every set`:"left reps in the tank"} at ${loadStr(workW)}.`;
    }
  } else if(minReps>=repMin){
    const tgt = Math.min(maxReps+1, repMax);
    plan = mk(workW, tgt);
    note = `Same ${loadStr(workW)} → push for ${tgt} reps.${anyGrind?" (last set was a grind — only if it moves.)":""}`;
  } else {
    plan = mk(workW, repMin); kind="repeat";
    note = `Repeat ${loadStr(workW)} for ${repMin} reps — you missed the bottom of the range last time.`;
    const stalls = await stallCount(ex.id);
    if(stalls>=2){
      const dw = round(workW+inc, inc);               // easing off = MORE assistance
      note = `Stalled ${stalls+1} sessions at ${loadStr(workW)}. Add a little help back (${loadStr(dw)}) and rebuild.`;
      kind="deload"; plan = mk(dw, repMin);
    }
  }
  return {plan,note,kind,prev};
}

// volume-paced double progression. Below the top of the rep range: add reps toward last session's
// tonnage +pct% (cheapest first: the set with the fewest reps), never past the cap. Once EVERY set hit
// the top of the range: all sets move up one increment together, and reps drop to keep each set about
// as hard as last time (Epley) — e.g. 77.5×12 ×3 → 80×11 ×3. (It used to graduate one set at a time
// while keeping volume flat, which with small jumps meant "same 12 reps, more weight" on a rising
// ladder like 80×12 · 80×12 · 82.5×12.) Returns {plan,Vlast,Vnew,weightAdded,repAdded}.
// normalize a past session's sets into exactly `sets` working sets (drop the lightest extras, pad
// with the lightest), sorted light→heavy. Shared by progress / hold / deload. Returns {seed, Vlast}.
function normalizeSeed(lastSets, sets){
  let seed = (lastSets||[]).map(s=>({weight:+s.weight||0, reps:+s.reps||0})).filter(s=>s.reps>0);
  if(!seed.length) seed=[{weight:0,reps:1}];
  if(seed.length>sets) seed = seed.slice().sort((a,b)=> b.weight-a.weight || b.reps-a.reps).slice(0,sets);
  while(seed.length<sets){ const l=seed.reduce((a,b)=> (b.weight<a.weight||(b.weight===a.weight&&b.reps<a.reps))?b:a); seed.push({weight:l.weight,reps:l.reps}); }
  seed.sort((a,b)=> a.weight-b.weight || a.reps-b.reps);
  return { seed, Vlast: seed.reduce((t,s)=>t+s.weight*s.reps,0) };
}
function volumeProgress(lastSets, {sets,repMin,repMax,inc,pct}){
  const { seed, Vlast } = normalizeSeed(lastSets, sets);
  const vol = arr => arr.reduce((t,s)=>t+s.weight*s.reps,0);
  if(seed.every(s=>s.reps>=repMax)){                                   // earned it → add weight to every set
    const w=round(Math.max(...seed.map(s=>s.weight))+inc, inc);
    const plan=seed.map(s=>({weight:w, reps:Math.max(repMin, Math.min(repMax-1, Math.round(30*(epley(s.weight,s.reps)/w-1))))}))
      .sort((a,b)=> a.weight-b.weight || a.reps-b.reps);
    return { plan, Vlast, Vnew: vol(plan), weightAdded:true, repAdded:false };
  }
  const Vtarget = Vlast*(1+pct/100);
  const plan = seed.map(s=>({weight:s.weight,reps:s.reps}));
  let repAdded=false, guard=0;
  while(vol(plan) < Vtarget && guard++ < 600){
    let i=-1, few=Infinity;
    for(let k=0;k<plan.length;k++){ if(plan[k].reps<repMax && plan[k].reps<few){ few=plan[k].reps; i=k; } }
    if(i<0) break;                                                     // every set at the cap — weight goes on next time
    plan[i].reps++; repAdded=true;
  }
  return { plan, Vlast, Vnew: vol(plan), weightAdded:false, repAdded };
}
const fmtW = (w,ex)=> `${(+w).toLocaleString(undefined,{maximumFractionDigits:2})}${ex.unit||"kg"}`;

/* ---------- "same machine" linking across gyms ---------- */
// a gym-scoped, same-named machine at a DIFFERENT gym, not already linked to ex
function findSameNameOtherGym(ex){
  const t=normName(ex.name);
  return State.exercises.find(e=> e.id!==ex.id && e.gymId!=null && e.gymId!==ex.gymId
    && normName(e.name)===t && !(ex.linkId && e.linkId===ex.linkId));
}
async function linkExercises(a,b){
  const lid = b.linkId || a.linkId || b.id;
  a.linkId=lid; b.linkId=lid;
  await DB.put("exercises",a); await DB.put("exercises",b);
  State.exercises=await DB.all("exercises");
}
// ask once, in context, whether a newly-added machine is the same as one at another gym
function maybePromptSameMachine(ex){
  if(!equipGymScoped(ex.equipment)) return;        // only machines/cables are gym-bound
  const other=findSameNameOtherGym(ex);
  if(!other) return;
  const canEquiv = canBeEquivalent(ex) && canBeEquivalent(other) && !ex.equivId && !other.equivId;
  openSheet("Same machine?", (body,close)=>{
    body.append(el("p",{class:"small muted",style:"margin-top:-6px"},
      `You also have "${other.name}" at ${gymNameOf(other.gymId)}. If it's the exact same machine, I'll combine their progress into one trend. If it's a different machine for the same movement, I can map suggestions between them instead.`));
    body.append(
      el("button",{class:"btn",onClick:async()=>{ await linkExercises(ex,other); close(); render(); toast("Combined — progress is now shared"); }}, ic("check"), "Same machine — combine"),
      ...(canEquiv?[el("button",{class:"btn secondary",style:"margin-top:8px",onClick:async()=>{ await linkEquivalent(ex,other); close(); render(); toast("Linked as equivalent — separate history, mapped suggestions"); }}, ic("link",16), "Different machine — same movement")]:[]),
      el("button",{class:"btn ghost",style:"margin-top:8px",onClick:close}, canEquiv?"Unrelated":"Different machine"));
  });
}

/* ============================================================
   EQUIVALENT MACHINES  (same movement, different machine)
   linkId = same physical machine (histories pool).
   equivId = same movement on a different machine: histories and PRs stay
   separate; only a calibration ratio (an "exchange rate") is shared, so
   suggestions can be mapped as HINTS. v1: loaded machines/cables only,
   pairwise groups. With no equivId anywhere, all of this is inert.
   ============================================================ */
const canBeEquivalent = ex => !!(ex && ex.gymId && (ex.equipment==="machine"||ex.equipment==="cable"));
const equivGroup = equivId => State.exercises.filter(e=>e.equivId===equivId);
// one exercise per physical machine (a linkId pool counts as a single node)
function equivNodes(equivId){
  const seen=new Set(), nodes=[];
  for(const e of equivGroup(equivId)){ const k=e.linkId||e.id; if(seen.has(k))continue; seen.add(k); nodes.push(e); }
  return nodes;
}
// the equivalent counterpart of ex (the other node of its pair), or null
function equivOther(ex){
  if(!ex||!ex.equivId) return null;
  const myKey=ex.linkId||ex.id;
  return equivNodes(ex.equivId).find(n=>(n.linkId||n.id)!==myKey) || null;
}
async function putCalib(equivId, rec){ await setMeta("calib:"+equivId, rec); (State.calib=State.calib||{})[equivId]=rec; }
async function linkEquivalent(a,b){
  const eid=a.equivId||b.equivId||("eq-"+uid());
  const ids=new Set([...linkedIds(a.id), ...linkedIds(b.id)]);
  for(const e of State.exercises){ if(ids.has(e.id)){ e.equivId=eid; await DB.put("exercises",e); } }
  State.exercises=await DB.all("exercises");
  await recomputeCalib(eid);          // initial ratio from any overlapping history
  return eid;
}
async function unlinkEquiv(equivId){
  for(const e of State.exercises.filter(e=>e.equivId===equivId)){ delete e.equivId; await DB.put("exercises",e); }
  await DB.del("meta","calib:"+equivId);
  if(State.calib) delete State.calib[equivId];
  State.exercises=await DB.all("exercises");
}
// best per-session e1RM series for a machine (pooled across its linkId group): [{date, m}]
async function e1rmSeries(exId){
  let sets=[]; for(const id of linkedIds(exId)) sets=sets.concat(await DB.byIndex("sets","exerciseId",id));
  const by=Object.fromEntries((await DB.all("sessions")).map(s=>[s.id,s]));
  const bySession={};
  for(const s of sets){ if(!(s.reps>0))continue; const se=by[s.sessionId]; if(!se)continue;
    bySession[se.date]=Math.max(bySession[se.date]||0, epley(+s.weight||0, s.reps)); }
  return Object.entries(bySession).sort((a,b)=>a[0].localeCompare(b[0])).map(([date,m])=>({date,m}));
}
// calibration pairs: for each B session, the nearest A session ≤14 days away (each A used once)
function calibPairs(seriesA, seriesB){
  const usedA=new Set(), pairs=[];
  for(const b of seriesB){
    let best=null, bestD=15;
    for(let i=0;i<seriesA.length;i++){
      if(usedA.has(i))continue;
      const d=Math.abs((new Date(b.date+"T12:00:00")-new Date(seriesA[i].date+"T12:00:00"))/86400000);
      if(d<=14 && d<bestD){ bestD=d; best=i; }
    }
    if(best!=null){ usedA.add(best); pairs.push({a:seriesA[best].m, b:b.m, date:b.date}); }
  }
  return pairs;
}
// least squares through the origin (zero strength = zero on both rulers; robust with few points)
function calibRatio(pairs){
  if(!pairs||!pairs.length) return null;
  let saa=0,sab=0; for(const p of pairs){ saa+=p.a*p.a; sab+=p.a*p.b; }
  return saa>0 ? sab/saa : null;
}
// recompute a pair's ratio from history (lazily, after sessions commit). Keeps the original
// anchor (the reference ruler) once set; preserves any RPE drift as a factor on the new fit.
async function recomputeCalib(equivId){
  const nodes=equivNodes(equivId); if(nodes.length<2) return null;
  const [n1,n2]=nodes;
  const s1=await e1rmSeries(n1.id), s2=await e1rmSeries(n2.id);
  const prev=await getMeta("calib:"+equivId);
  let anchorId = prev?.anchor;
  if(!anchorId || ![...linkedIds(n1.id),...linkedIds(n2.id)].includes(anchorId))
    anchorId = s1.length>=s2.length ? n1.id : n2.id;
  const aIsN1=linkedIds(n1.id).includes(anchorId);
  const pairs=calibPairs(aIsN1?s1:s2, aIsN1?s2:s1).slice(-8);   // rolling, last 8
  const fitted=calibRatio(pairs);
  if(fitted==null){                       // nothing paired yet — keep a cold-start seed if present
    if(prev) return prev;
    return null;
  }
  const drift = (prev && prev.fitted>0 && prev.ratio>0) ? Math.max(0.85,Math.min(1.15,prev.ratio/prev.fitted)) : 1;
  const rec={pairs, fitted, ratio:fitted*drift, anchor:anchorId, updatedAt:new Date().toISOString()};
  await putCalib(equivId, rec);
  return rec;
}
// exchange rate INTO ex's units: multiply the other machine's weights by this
function calibRateFor(ex){
  const rec=State.calib && ex && ex.equivId ? State.calib[ex.equivId] : null;
  if(!rec || !(rec.ratio>0)) return null;
  return linkedIds(ex.id).includes(rec.anchor) ? 1/rec.ratio : rec.ratio;
}
// first completed set on a machine with an equivalent but no calibration yet →
// one quick question seeds the exchange rate (±7% by feel)
async function maybeSeedCalib(ex, set){
  if(!ex||!ex.equivId||!(+set.reps>0)) return;
  const rec=await getMeta("calib:"+ex.equivId);
  if(rec && (rec.ratio>0 || (rec.pairs&&rec.pairs.length))) return;
  const s=State.activeSession; if(!s || s["calibAsked_"+ex.equivId]) return;
  const other=equivOther(ex); if(!other) return;
  const oSeries=await e1rmSeries(other.id); if(!oSeries.length) return;
  const a=oSeries[oSeries.length-1].m, b=epley(+set.weight||0, +set.reps);
  if(!(a>0&&b>0)) return;
  s["calibAsked_"+ex.equivId]=true; persistSession();
  openSheet("Quick calibration",(body,close)=>{
    body.append(el("p",{class:"small muted",style:"margin-top:-6px"},
      `First time mapping this machine. Compared to ${other.name} at ${gymNameOf(other.gymId)}, how did that set feel?`));
    const pick=async f=>{
      const ratio=(b*f)/a;                 // anchor = the machine that already has history
      await putCalib(ex.equivId,{pairs:[{a, b:b*f, date:todayISO()}], fitted:ratio, ratio, anchor:other.id, updatedAt:new Date().toISOString()});
      close(); toast("Got it — suggestions between these machines are calibrated");
    };
    body.append(
      el("button",{class:"btn secondary",onClick:()=>pick(1.07)},"Easier than usual"),
      el("button",{class:"btn",style:"margin-top:8px",onClick:()=>pick(1)},"About the same"),
      el("button",{class:"btn secondary",style:"margin-top:8px",onClick:()=>pick(0.93)},"Harder than usual"));
  }, {stacked: !!document.querySelector("#sheetHost .sheet")});
}

const TAB_TITLES={today:"NextSet",history:"History",insights:"Insights",library:"Library",settings:"Settings"};
function setTab(tab){
  if(tab==="more") tab="library";                       // old name
  const changed=tab!==currentTab;
  currentTab=tab;
  document.querySelectorAll(".tabbar button").forEach(b=>{ const on=b.dataset.tab===tab; b.classList.toggle("active",on); if(on) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  render();
  if(changed) window.scrollTo(0,0);
}
function render(){
  const v=$("#view"); v.innerHTML="";
  document.body.classList.toggle("logging", currentTab==="today" && !!State.activeSession?.started);
  { const tb=document.querySelector("header.topbar"); if(tb) document.documentElement.style.setProperty("--tb", tb.offsetHeight+"px"); }
  const noGyms = !State.gyms.length;
  // during first-run setup there are no tabs to switch between — hide the chrome
  document.querySelector(".tabbar").style.display = noGyms ? "none" : "";
  $("#gymPick").style.display = noGyms ? "none" : "";
  $("#gearBtn").style.display = noGyms ? "none" : "";
  $("#gearBtn").classList.toggle("on", currentTab==="settings");
  $("#titleText").textContent = noGyms ? "NextSet" : (TAB_TITLES[currentTab]||"NextSet");
  { const gp=$("#gymPick"), g=curGym(); gp.replaceChildren(...(g?[el("span",{class:"gdot",style:`background:${gymHue(g.id)}`}), el("span",{class:"gp-name"},g.name)]:[document.createTextNode("Set up gym")])); }
  if(noGyms){ return v.append(viewOnboard()); }
  // on any tab other than Today, keep a live reminder that a workout is running
  if(State.activeSession?.started && currentTab!=="today"){
    const st=State.activeSession.startedAt;
    v.append(el("button",{class:"inprogress-pill",onClick:()=>setTab("today")},
      el("span",{class:"ipdot"}), el("span",{style:"flex:1;text-align:left"},"Workout in progress"),
      el("span",{id:"restPillClock",class:"pill-rest",style:"display:none"}),
      ...(st?[el("span",{id:"elapsedClock",style:"font-variant-numeric:tabular-nums;font-weight:800"}, fmtElapsed(Date.now()-new Date(st).getTime()))]:[]),
      ic("chevron",16)));
    updateRestPill();
  }
  if(currentTab==="today") v.append(viewToday());
  else if(currentTab==="history") v.append(viewHistory());
  else if(currentTab==="insights") v.append(viewInsights());
  else if(currentTab==="library") v.append(viewLibrary());

}

  const h1={id:"demo-h-pulldown",gymId:g2,name:"Lat Pulldown (Wide Grip)",unit:"kg",equipment:"cable",increment:5,sets:3,repMin:8,repMax:12,primary:"lats",secondary:"biceps",invertProgress:false,restSec:120,demo:true};

      let w = fixed!=null ? fixed : Math.round((def[6]+(def[7]-def[6])*frac)/def[5])*def[5];
      const stall = e.id==="demo-lat" && frac>0.55;   // a real plateau for the Alerts tab
      if(stall) w=7.5;
      for(let k=0;k<3;k++){
        let reps = e.equipment==="bodyweight" ? Math.max(4, Math.round(5+frac*5)-k) : Math.max(6, 12-k-Math.round(rnd()*2));
        if(stall) reps=[10,9,8][k];
        else reps=Math.max(4, Math.min(12, reps+repAdj));
        await DB.put("sets",{id:"demo-set-"+(sc++),sessionId:sid,exerciseId:e.id,weight:e.equipment==="bodyweight"?0:w,reps,
          rpe:k===2?(rnd()<.35?"grind":rnd()<.5?"solid":"easy"):null,joint:false,order:order++,createdAt:new Date(t0.getTime()+order*150000).toISOString(),demo:true});
      }
    }
  }
  for(const pl of Object.values(plans)) await DB.put("plans",pl);
  State.currentGymId=g1; await setMeta("currentGymId",g1);
  await loadState(); _exStatus=null; setTab("today"); toast("Loaded 10 weeks of sample data");
}

// the plan you're due for (see the rules inside). A suggestion — every plan is one tap away.
function nextPlan(plans){
  // plans saved for the gym you're at come first; other gyms' plans only when this gym has none
  const here=plans.filter(p=>p.gymId===State.currentGymId), pool0=here.length?here:plans;
  // 1) weekly habit: the plan you did on THIS weekday in most recent weeks (2+ times in the last 6
  //    weeks, and more than half of that weekday's workouts) — unless you did it today or yesterday
  const dow=new Date().getDay(), ids=new Set(pool0.map(p=>p.id)), tally={};
  for(const x of (State.planDays||[])){ const a=daysAgo(x.date);
    if(a<1 || a>42 || !ids.has(x.planId) || new Date(x.date+"T12:00:00").getDay()!==dow) continue;
    tally[x.planId]=(tally[x.planId]||0)+1; }
  const total=Object.values(tally).reduce((t,v)=>t+v,0);
  const top=Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
  if(top && top[1]>=2 && top[1]/total>0.5){
    const p=pool0.find(x=>x.id===top[0]);
    if(p && !(p.lastUsedAt && daysAgo(p.lastUsedAt)<=1))
      return {plan:p, why:`You usually do this on ${new Date().toLocaleDateString(undefined,{weekday:"long"})}s`};
  }
  // 2) rotation: least-recently-done of the plans in use (last 4 weeks); else the oldest-done / never-done
  const recent=pool0.filter(p=>p.lastUsedAt && daysAgo(p.lastUsedAt)<=28);
  const pool=recent.length?recent:pool0;
  const plan=pool.slice().sort((a,b)=>(a.lastUsedAt||"").localeCompare(b.lastUsedAt||"") || (a.createdAt||"").localeCompare(b.createdAt||""))[0];
  return {plan, why: recent.length>1 ? "Next in your rotation — the one you did longest ago" : ""};
}

// "↑ 2 heavier · 3 more reps" for a plan, from the engine's own suggestions (read-only peek)
async function planProgressLine(plan){
  let heavier=0, reps=0, hold=0, first=0; const keys=[];
  for(const it of plan.items){
    const ex=resolveExerciseAtGym(it.exerciseId, State.currentGymId); if(!ex) continue;
    const sug=await suggestNext(ex,{peek:true});
    if(sug.kind==="weight") heavier++; else if(sug.kind==="rep") reps++; else if(sug.kind==="new") first++; else hold++;
    if(isKeyLift(ex) && sug.plan && sug.kind!=="new") keys.push({ex, sug});
  }
  // key lifts named, with today's ask — "★ Bench Press · 65kg × 8 · 8 · 8 ↑"
  const keyLines=keys.slice(0,3).map(({ex,sug})=>el("div",{class:"keyline"},
    el("span",{class:"ks"},ic("starfill",12)), el("b",{},ex.name), el("span",{class:"muted"}," · "+fmtTargets({sets:sug.plan,kind:sug.kind},ex)),
    (sug.kind==="weight"||sug.kind==="rep")?el("span",{class:"up"}," ↑"):""));
  const parts=[];
  if(heavier) parts.push(el("span",{class:"progpill up"},`↑ ${heavier} heavier`));
  if(reps) parts.push(el("span",{class:"progpill up"},`↑ ${reps} more reps`));
  if(hold) parts.push(el("span",{class:"progpill hold"},`→ ${hold} hold`));
  if(first) parts.push(el("span",{class:"progpill hold"},`${first} new lift${first>1?"s":""} — log a first set`));
  if(!parts.length && !keyLines.length) return el("span");
  return el("div",{}, ...(parts.length?[el("div",{class:"row",style:"gap:6px;flex-wrap:wrap"},...parts)]:[]),
    ...(keyLines.length?[el("div",{style:"margin-top:8px"}, ...keyLines)]:[]));
}

// per-exercise training status (cached; invalidated when a workout is logged): tried + progressing
let _exStatus=null;
async function getExStatus(){
  if(_exStatus) return _exStatus;
  const [allSets, sessions]=await Promise.all([DB.all("sets"), DB.all("sessions")]);
  const sesKey={}; sessions.forEach(s=>{ sesKey[s.id]=(s.date||"")+(s.startedAt||""); });
  const byEx={}; allSets.forEach(x=>{ if(x.reps>0)(byEx[x.exerciseId]=byEx[x.exerciseId]||[]).push(x); });
  const map={};
  for(const ex of State.exercises){
    let sets=[]; for(const id of linkedIds(ex.id)) sets=sets.concat(byEx[id]||[]);
    if(!sets.length){ map[ex.id]={tried:false,progressing:false}; continue; }
    const bw=isBW(ex), bySes={};
    sets.forEach(x=>{ const m=bw?x.reps:(+x.weight||0); bySes[x.sessionId]=Math.max(bySes[x.sessionId]||0,m); });
    const ord=Object.keys(bySes).sort((a,b)=>(sesKey[b]||"").localeCompare(sesKey[a]||""));
    map[ex.id]={tried:true, progressing: ord.length>=2 && bySes[ord[0]]>bySes[ord[1]]};
  }
  _exStatus=map; return map;
}
