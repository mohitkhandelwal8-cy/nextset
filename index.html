    const results=el("div",{}), note=el("div",{class:"tiny muted",style:"margin:8px 2px"}); body.append(results, note);
    const CAP=40;
    function row(e){
      const open=async()=>{ await linkExerciseToLib(ex, e.raw.id); close(); openExerciseProgress(ex.id); };
      const thumb=el("div",{class:"exthumb"}, ic("dumbbell",18));
      const img=document.createElement("img"); img.src=libImageUrl(e.raw.id,0); img.loading="lazy"; img.alt=""; img.onerror=()=>img.remove(); thumb.append(img);
      const grow=el("div",{class:"grow"}, el("div",{class:"name"},e.name), el("div",{class:"small muted"}, equipLabel(e.equipment)||"Other"));
      const tags=[]; if(e.primary&&muscleLabel(e.primary))tags.push(muscleTag(muscleLabel(e.primary),regionOf(e.primary),true)); if(e.secondary&&muscleLabel(e.secondary))tags.push(muscleTag(muscleLabel(e.secondary),regionOf(e.secondary),false));
      if(tags.length) grow.append(el("div",{class:"mtags"},...tags));
      return el("div",{class:"listitem",role:"button",tabindex:"0","aria-label":`Link ${e.name}`,style:"cursor:pointer;gap:10px",
        onClick:open, onKeydown:ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();open();}}}, thumb, grow, el("span",{class:"chev"},ic("chevron",18)));
    }
    function render(){
      results.innerHTML="";
      if(!LIB){ results.append(el("p",{class:"muted small"},"Loading…")); note.textContent=""; return; }
      const q=normName(search.value);
      let list;
      if(!q){ list=LIB; }
      else {
        const STOP=new Set(["machine","cable","barbell","dumbbell","kettlebell","bodyweight","weighted","selectorized","smith","band","bands","with"]);
        const all=q.split(" ").filter(w=>w.length>1), sig=all.filter(w=>!STOP.has(w)), use=sig.length?sig:all;
        list=LIB.map(e=>{ const nt=normName(e.name).split(" ");
            const s=use.filter(w=> nt.some(x=> x===w || x.startsWith(w))).length;   // word match, incl. fly→flyes
            return {e,s}; })
          .filter(x=>x.s>0).sort((a,b)=> b.s-a.s || a.e.name.length-b.e.name.length).map(x=>x.e);
      }
      if(!list.length){ results.append(el("p",{class:"muted small"},"No matches — try a different term.")); note.textContent=""; return; }
      list.slice(0,CAP).forEach(e=>results.append(row(e)));
      note.textContent = list.length>CAP ? `Showing ${CAP} of ${list.length} — keep typing to narrow.` : `${list.length} match${list.length===1?"":"es"}`;
    }
    search.addEventListener("input",render); render();
    loadLibrary().then(render).catch(()=>{ results.innerHTML=""; results.append(el("p",{class:"muted small"},"Couldn't load the library — reconnect and try again.")); });
  }, {stacked:true});
}

// device-local meta keys: never leave this device in a backup (a restored backup must not
// carry another phone's identity or cloud-backup bookkeeping)
const DEVICE_META=new Set(["activeSession","deviceId","gdriveLastBackup","gdrivePending","gdriveSeenRemote","gdriveAuto"]);
async function buildBackupData(){
  const [gyms,exercises,sessions,sets,plans,meta]=await Promise.all(
    ["gyms","exercises","sessions","sets","plans","meta"].map(s=>DB.all(s)));
  return {app:"nextset",version:APP_VERSION,gyms,exercises,sessions,sets,plans,
          meta:meta.filter(m=>!DEVICE_META.has(m.k))};
}
async function exportData(kind){
  const data=await buildBackupData();
  const {gyms,exercises,sessions,sets}=data;
  let blob,fname;
  if(kind==="json"){
    blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    fname="nextset-export.json";
  } else {
    const exName=id=>exercises.find(e=>e.id===id)?.name||"";
    const gName=id=>gyms.find(g=>g.id===id)?.name||"";
    const sesById=Object.fromEntries(sessions.map(s=>[s.id,s]));
    const rows=[["date","gym","exercise","set","weight","reps","rpe","joint"]];
    sets.sort((a,b)=>{const A=sesById[a.sessionId],B=sesById[b.sessionId];
      return ((B?.date||"")+'').localeCompare((A?.date||""))||a.order-b.order;});
    sets.forEach(x=>{const se=sesById[x.sessionId];
      rows.push([se?.date||"",gName(se?.gymId),exName(x.exerciseId),x.order+1,x.weight,x.reps,x.rpe||"",x.joint?"yes":""]);});
    blob=new Blob([rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n")],{type:"text/csv"});
    fname="nextset-sets.csv";
  }
  const url=URL.createObjectURL(blob);
  const a=el("a",{href:url,download:fname}); document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("Exported "+fname);
}

/* ---------- import / restore from a backup ---------- */
const IMPORT_STORES=["gyms","exercises","sessions","sets","plans"];
const REQUIRED_STORES=["gyms","exercises","sessions","sets"];   // plans is newer — old backups lack it
function isValidBackup(d){ return !!d && typeof d==="object" && REQUIRED_STORES.every(s=>Array.isArray(d[s])); }
// write a backup into the DB. "replace" wipes the core stores first; "merge" upserts by id.
async function applyImport(data, mode){
  if(mode==="replace"){
    for(const s of IMPORT_STORES){ for(const r of await DB.all(s)){ if(r&&r.id!=null) await DB.del(s, r.id); } }
  }
  const counts={};
  for(const s of IMPORT_STORES){
    let n=0; for(const r of (data[s]||[])){ if(r&&r.id!=null){ await DB.put(s, r); n++; } }
    counts[s]=n;
  }
  if(Array.isArray(data.meta)){ for(const m of data.meta){ if(m&&m.k&&!DEVICE_META.has(m.k)) await DB.put("meta", m); } }
  return counts;
}
async function runImport(data, mode){
  await applyImport(data, mode);
  State.activeSession=null; await setMeta("activeSession", null);          // never resume a session across a restore
  _exStatus=null;
  await loadState();
  if(!State.gyms.find(g=>g.id===State.currentGymId)){ State.currentGymId=State.gyms[0]?.id||null; await setMeta("currentGymId", State.currentGymId); }
  render();
  toast(`Restored ${data.sessions.length} workout${data.sessions.length!==1?"s":""}`);
}
function openImportConfirm(data, onDone){
  const f=(n,one)=>`${n} ${n===1?one:one+"s"}`;
  const summary=`${f(data.gyms.length,"gym")}, ${f(data.exercises.length,"exercise")}, ${f(data.sessions.length,"workout")}, ${data.sets.length} sets`;
  openSheet("Restore backup",(body,close)=>{
    body.append(
      el("p",{class:"small",style:"margin:-2px 0 4px;font-weight:600"},`This backup holds ${summary}.`),
      el("p",{class:"small muted"},"Merge keeps what's on this device and adds anything new (matching entries get updated — nothing is deleted). Replace erases everything here first, then loads the backup — use that when restoring onto a fresh install."),
      el("button",{class:"btn",style:"margin-top:10px",onClick:async()=>{ close(); try{ await runImport(data,"merge"); if(onDone) await onDone("merge"); }catch(e){ noticeSheet("Import failed", String(e.message||e)); } }},ic("inbox",16),"Merge with my data"),
      el("button",{class:"btn danger",style:"margin-top:10px",onClick:async()=>{ if(!(await confirmSheet({title:"Replace everything?", message:"All data on this device is erased first, then the backup is loaded.", confirmLabel:"Erase and restore", danger:true}))) return; close(); try{ await runImport(data,"replace"); if(onDone) await onDone("replace"); }catch(e){ noticeSheet("Import failed", String(e.message||e)); } }},ic("alert",16),"Replace everything"),
      el("button",{class:"btn secondary",style:"margin-top:10px",onClick:close},"Cancel")
    );
  });
}
function importDataFromFile(){
  const inp=el("input",{type:"file",accept:"application/json,.json",style:"position:fixed;left:-9999px"});
  document.body.append(inp);
  inp.addEventListener("change", async ()=>{
    const file=inp.files&&inp.files[0]; inp.remove();
    if(!file) return;
    let data;
    try{ data=JSON.parse(await file.text()); }
    catch(e){ noticeSheet("Couldn't read that file", "Pick a NextSet backup — the .json file from Export everything."); return; }
    if(!isValidBackup(data)){ noticeSheet("Not a NextSet backup", "Use a file from Settings → Your data → Export everything."); return; }
    openImportConfirm(data);
  });
  inp.click();
}


/* ---------- optional cloud backup — the user's OWN Google Drive ----------
   Off until the user connects. Data goes to Drive's hidden per-app folder
   (scope drive.appdata): NextSet can only see its own single backup file,
   never the rest of the Drive, and no NextSet server exists — the phone
   talks straight to Google. Disconnecting changes nothing on-device. */
const GOOGLE_CLIENT_ID = "PASTE-YOUR-CLIENT-ID.apps.googleusercontent.com";   // per-deploy config — see SETUP-GOOGLE-SYNC.md
const GDRIVE_SCOPE = "https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email";
const GDRIVE_FILE = "nextset-backup.json";
const gdriveConfigured = () => !GOOGLE_CLIENT_ID.startsWith("PASTE-") && /apps\.googleusercontent\.com$/.test(GOOGLE_CLIENT_ID);

// --- auth state: {token, exp, email} in localStorage; tokens live ~1h, email marks "connected"
function gAuthState(){ try{ return JSON.parse(localStorage.getItem("nextset-gauth")||"null")||{}; }catch(e){ return {}; } }
function gAuthSave(patch){ try{ localStorage.setItem("nextset-gauth", JSON.stringify({...gAuthState(),...patch})); }catch(e){} }
function gTokGet(){ const a=gAuthState(); return (a.token && a.exp>Date.now()+6e4) ? a.token : null; }
function gTokDrop(){ gAuthSave({token:null, exp:0}); }
const gAccountEmail = () => gAuthState().email || null;
const gConnected = () => !!gAccountEmail();
function gDisconnect(){
  const a=gAuthState();
  try{ if(a.token && window.google?.accounts?.oauth2?.revoke) google.accounts.oauth2.revoke(a.token, ()=>{}); }catch(e){}
  try{ localStorage.removeItem("nextset-gauth"); }catch(e){}
}
let _deviceId=null;
async function ensureDeviceId(){ if(!_deviceId){ _deviceId=await getMeta("deviceId"); if(!_deviceId){ _deviceId=uid(); await setMeta("deviceId",_deviceId); } } return _deviceId; }

let _gisLoading=null;
function loadGIS(){
  if(window.google?.accounts?.oauth2) return Promise.resolve();
  if(_gisLoading) return _gisLoading;
  _gisLoading=new Promise((res,rej)=>{
    const s=el("script",{src:"https://accounts.google.com/gsi/client"});
    s.addEventListener("load",()=>res());
    s.addEventListener("error",()=>{ _gisLoading=null; rej(new Error("Couldn't reach Google — check your connection")); });
    document.head.append(s);
  });
  return _gisLoading;
}
// interactive=true may show Google's popup; false attempts a quiet re-grant and fails fast
function gGetToken(interactive){
  const cached=gTokGet();
  if(cached) return Promise.resolve(cached);
  if(!navigator.onLine) return Promise.reject(new Error("You're offline — will back up later"));
  return loadGIS().then(()=>new Promise((res,rej)=>{
    let settled=false;
    const done=(fn,v)=>{ if(!settled){ settled=true; fn(v); } };
    try{
      const tc=google.accounts.oauth2.initTokenClient({
        client_id:GOOGLE_CLIENT_ID, scope:GDRIVE_SCOPE,
        callback:async r=>{
          if(r && r.access_token){
            let email=gAccountEmail();
            if(!email){ try{ const u=await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:{Authorization:"Bearer "+r.access_token}}); email=(await u.json()).email||null; }catch(e){} }
            gAuthSave({token:r.access_token, exp:Date.now()+(+r.expires_in||3600)*1000, email});
            done(res, r.access_token);
          } else done(rej, new Error(r?.error||"Sign-in didn't finish"));
        },
        error_callback:e=>done(rej, new Error(e?.type==="popup_closed"?"Sign-in was closed":(e?.message||"Sign-in failed"))),
      });
      tc.requestAccessToken({prompt:""});
      if(!interactive) setTimeout(()=>done(rej, new Error("needs sign-in")), 8000);   // a quiet attempt must never hang
    }catch(e){ done(rej, e); }
  }));
}

async function gFetch(url, opts, tok){
  const r=await fetch(url, {...opts, headers:{...(opts.headers||{}), Authorization:"Bearer "+tok}});
  if(r.status===401 || r.status===403){ gTokDrop(); const e=new Error("Google sign-in expired — try again"); e.auth=true; throw e; }
  if(!r.ok) throw new Error("Google Drive error ("+r.status+")");
  return r;
}
async function gdriveFind(tok){
  const q=encodeURIComponent(`name='${GDRIVE_FILE}'`);
  const r=await gFetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime,appProperties)`,{},tok);
  return (await r.json()).files?.[0]||null;
}
function gMultipart(meta, content){
  const b="nextset_"+uid().replace(/[^a-z0-9]/gi,"");
  return { type:`multipart/related; boundary=${b}`,
    body:`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${b}--` };
}
// the latest remote state this device has either written or knowingly pulled in
async function gdriveSeenAt(){
  const a=Date.parse(await getMeta("gdriveLastBackup")||"")||0;
  const b=Date.parse(await getMeta("gdriveSeenRemote")||"")||0;
  return Math.max(a,b);
}

let _gBackupBusy=false;
/* Back up this device's full data as THE backup file (whole-file last-write-wins).
   Guard: if Drive holds something newer written by a DIFFERENT device, don't clobber it —
   manual → offer merge-first / overwrite; auto → mark pending and wait for the user. */
async function gdriveBackup({manual=false, force=false}={}){
  if(!gdriveConfigured()) throw new Error("Cloud backup isn't set up in this build");
  if(_gBackupBusy) return "busy";
  _gBackupBusy=true;
  try{
    const tok=await gGetToken(manual);
    const f=await gdriveFind(tok);
    const dev=await ensureDeviceId();
    if(f && !force){
      const remoteAt=f.appProperties?.updatedAt || f.modifiedTime;
      const other=f.appProperties?.deviceId && f.appProperties.deviceId!==dev;
      if(other && remoteAt && Date.parse(remoteAt) > (await gdriveSeenAt())+2000){
        if(manual) openGdriveConflictSheet(remoteAt); else await setMeta("gdrivePending", true);
        return "conflict";
      }
    }
    const updatedAt=new Date().toISOString();
    const payload={...await buildBackupData(), deviceId:dev, updatedAt};
    const meta=f ? {appProperties:{deviceId:dev, updatedAt}}
                 : {name:GDRIVE_FILE, parents:["appDataFolder"], appProperties:{deviceId:dev, updatedAt}};
    const mp=gMultipart(meta, JSON.stringify(payload));
    await gFetch(`https://www.googleapis.com/upload/drive/v3/files${f?"/"+f.id:""}?uploadType=multipart&fields=id`,
      {method:f?"PATCH":"POST", headers:{"Content-Type":mp.type}, body:mp.body}, tok);
    await setMeta("gdriveLastBackup", updatedAt);
    await setMeta("gdrivePending", false);
    return "ok";
  } finally { _gBackupBusy=false; }
}
async function gdriveRestore(){
  const tok=await gGetToken(true);
  const f=await gdriveFind(tok);
  if(!f){ toast("No backup in your Drive yet"); return; }
  toast("Fetching your Drive backup…");
  const data=await (await gFetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`,{},tok)).json();
  if(!isValidBackup(data)){ toast("That backup file looks damaged"); return; }
  const remoteAt=f.appProperties?.updatedAt || f.modifiedTime || new Date().toISOString();
  openImportConfirm(data, async()=>{ await setMeta("gdriveSeenRemote", remoteAt); });
}
function openGdriveConflictSheet(remoteAt){
  openSheet("Newer backup in Drive",(body,close)=>{
    body.append(
      el("p",{class:"small muted",style:"margin-top:-6px"},
        `Your Drive backup was written by another device${remoteAt?" · "+fmtAgo(remoteAt):""}. Bring that data in first so nothing gets lost, or overwrite it with this phone's data.`),
      el("button",{class:"btn",onClick:async()=>{ close(); try{ await gdriveRestore(); }catch(e){ toast(e.message||"Couldn't fetch the backup"); } }},ic("inbox",16),"Bring that data in first"),
      el("button",{class:"btn danger",style:"margin-top:10px",onClick:async()=>{
        if(!(await confirmSheet({title:"Overwrite the Drive backup?", message:"It will hold only this phone's data.", confirmLabel:"Overwrite", danger:true}))) return;
        close();
        try{ await gdriveBackup({manual:true, force:true}); toast("Backed up to your Drive"); render(); }
        catch(e){ toast(e.message||"Backup failed"); }
      }},ic("alert",16),"Overwrite the backup"),
      el("button",{class:"btn secondary",style:"margin-top:10px",onClick:close},"Cancel"));
  });
}
// fire-and-forget: called after a workout is saved; never interrupts, never throws
function gdriveAutoKick(){
  if(!gdriveConfigured() || !gConnected()) return;
  (async()=>{
    if(await getMeta("gdriveAuto")===false) return;
    try{ await gdriveBackup({}); }
    catch(e){ try{ await setMeta("gdrivePending", true); }catch(_){} }
  })().catch(()=>{});
}
// on launch: quietly flush a pending/stale backup, but only with a still-valid token (no surprise popups)
async function gdriveBoot(){
  try{
    if(!gdriveConfigured() || !gConnected() || !navigator.onLine) return;
    if(await getMeta("gdriveAuto")===false) return;
    const last=await getMeta("gdriveLastBackup");
    const stale=!last || (Date.now()-Date.parse(last)) > 24*36e5;
    if((await getMeta("gdrivePending") || stale) && gTokGet()) await gdriveBackup({});
  }catch(e){}
}
function fmtAgo(iso){
  const ms=Date.now()-new Date(iso).getTime();
  if(!(ms>=0)) return "just now";
  if(ms<90e3) return "just now";
  const m=Math.round(ms/6e4); if(m<60) return m+" min ago";
  const h=Math.round(m/60); if(h<36) return h+" hr ago";
  const d=Math.round(h/24); return d+(d===1?" day ago":" days ago");
}
function gdriveCard(){
  const card=el("div",{class:"card"});
  card.append(el("h2",{},"Cloud backup"));
  const body=el("div");
  card.append(body);
  const paint=async()=>{
    body.innerHTML="";
    if(!gdriveConfigured()){
      body.append(el("p",{class:"small muted",style:"margin:-4px 0 0"},"Not available in this build."));
      return;
    }
    if(!gConnected()){
      body.append(
        el("p",{class:"small muted",style:"margin:-4px 0 0"},
          "Connect Google Drive and NextSet saves a backup there automatically after every workout — so a lost or new phone can't cost you your history. It lives in a private app folder in YOUR Drive that only NextSet can see. No NextSet server, no account with us."),
        el("button",{class:"btn secondary",style:"margin-top:10px",onClick:async()=>{
          try{
            await gGetToken(true);
            toast("Connected"); paint();
            const r=await gdriveBackup({manual:true});
            if(r==="ok") toast("First backup saved to your Drive");
            paint();
          }catch(e){ toast(e.message||"Couldn't connect"); }
        }},ic("cloud"),"Connect Google Drive"));
      return;
    }
    const [last,pending,auto]=await Promise.all([getMeta("gdriveLastBackup"),getMeta("gdrivePending"),getMeta("gdriveAuto")]);
    body.append(
      el("p",{class:"small muted",style:"margin:-4px 0 0"},"Connected · "+gAccountEmail()),
      el("p",{class:"small",style:"margin:6px 0 0;font-weight:600"},
        pending ? "Backup pending — tap Back up now" : (last ? "Last backed up "+fmtAgo(last) : "No backup yet")));
    const seg=el("div",{class:"seg",style:"margin-top:10px"});
    const isOn=auto!==false;
    [[true,"Auto after workouts"],[false,"Manual only"]].forEach(([v,lbl])=>
      seg.append(el("button",{class:"segbtn"+((v===isOn)?" on":""),"aria-pressed":v===isOn?"true":"false",
        onClick:async()=>{ await setMeta("gdriveAuto", v); paint(); }}, lbl)));
    body.append(seg,
      el("button",{class:"btn secondary",style:"margin-top:10px",onClick:async()=>{
        try{
          const r=await gdriveBackup({manual:true});
          if(r==="ok") toast("Backed up to your Drive");
          paint();
        }catch(e){ toast(e.message||"Backup failed"); paint(); }
      }},ic("upload"),"Back up now"),
      el("button",{class:"btn secondary",style:"margin-top:8px",onClick:async()=>{
        try{ await gdriveRestore(); }catch(e){ toast(e.message||"Couldn't fetch the backup"); }
      }},ic("inbox"),"Restore from Drive"),
      el("button",{class:"btn ghost",style:"margin-top:8px",onClick:async()=>{
        if(!(await confirmSheet({title:"Disconnect Google Drive?", message:"Your data stays on this phone and the backup stays in your Drive.", confirmLabel:"Disconnect"}))) return;
        gDisconnect(); toast("Disconnected"); paint();
      }},ic("x"),"Disconnect"));
  };
  paint();
  return card;
}

let swUpdateTriggered=false;
function showUpdateBanner(reg){
  if(document.getElementById("updateBar")) return;
  const bar=el("div",{class:"updatebar",id:"updateBar"},
    el("div",{class:"t"},"New version available"),
    el("button",{onClick:()=>{ swUpdateTriggered=true; const w=reg.waiting||reg.installing; if(w) w.postMessage("SKIP_WAITING"); bar.remove(); }},"Update"));
  document.body.append(bar);
}
// manual escape hatch — forces a fresh network check for sw.js and applies any new version
async function checkForUpdates(){
  if(!("serviceWorker" in navigator) || !location.protocol.startsWith("http")){ toast("Updates aren't available here"); return; }
  const reg = await navigator.serviceWorker.getRegistration();
  if(!reg){ toast("Reopen the app to enable updates"); return; }
  toast("Checking for updates…");
  try{ await reg.update(); }catch(e){}
  const apply=()=>{ if(reg.waiting){ swUpdateTriggered=true; reg.waiting.postMessage("SKIP_WAITING"); toast("Updating…"); return true; } return false; };
  if(apply()) return;
  if(reg.installing){ toast("Downloading new version…"); reg.installing.addEventListener("statechange",()=>apply()); return; }
  toast(`You're on the latest (${APP_VERSION})`);
}

(async function boot(){
  applyTheme();
  try{ if(window.matchMedia) matchMedia("(prefers-color-scheme: light)").addEventListener("change",()=>{ if(getTheme()==="system"){ applyTheme(); render(); } }); }catch(e){}
  try{ await DB.open(); await loadState(); render(); promptStaleSession(); gdriveBoot();
    if(State._renamed){ toast(`Tidied ${State._renamed} exercise name${State._renamed>1?"s":""} — your history is unchanged`); delete State._renamed; } }
  catch(e){ $("#view").innerHTML="<div class='empty'><div class='big'><svg viewBox='0 0 24 24' width='42' height='42' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z'/><path d='M12 9v4'/><path d='M12 17h.01'/></svg></div><p>Couldn't open local storage.</p><p class='muted small'>"+esc(e.message||e)+"</p></div>"; }
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    // updateViaCache:"none" → the sw.js script is never served from the HTTP cache on update
    // checks, so a new deploy is detected immediately (iOS caches it for 10 min otherwise).
    navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(reg=>{
      reg.update().catch(()=>{});   // force a check on every launch (iOS often skips the automatic one)
      if(reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg);
      reg.addEventListener("updatefound",()=>{
        const nw=reg.installing; if(!nw) return;
        nw.addEventListener("statechange",()=>{
          if(nw.state==="installed" && navigator.serviceWorker.controller) showUpdateBanner(reg);
        });
      });
    }).catch(()=>{});
    let refreshing=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{
      if(swUpdateTriggered && !refreshing){ refreshing=true; location.reload(); }
    });
    // re-check whenever the app is brought back to the foreground — a home-screen PWA resumed
    // from memory never re-navigates, so this is often the only time iOS will see a new version.
    document.addEventListener("visibilitychange",()=>{
      if(document.visibilityState==="visible") navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{});
    });
  }
})();
</script>
